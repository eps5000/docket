# Docket (formerly Task Lite). Start:  docker compose -f docker/compose.yaml up -d --build
name: docket

services:
  docket:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docket:local
    container_name: docket
    # Optional overrides; copy .env.example to .env to use them.
    env_file:
      - path: .env
        required: false
    environment:
      DOCKET_SEED: ${DOCKET_SEED:-}
      # Decision 32: empty or off is local trust (no unlock, no agent token); on is protected
      # mode. Set it in .env (DOCKET_PROTECTED_MODE=on), then restart.
      DOCKET_PROTECTED_MODE: ${DOCKET_PROTECTED_MODE:-}
      # Shown in Settings > Service health; keep it equal to the volume's name below.
      DOCKET_DATA_VOLUME: docket-data
    ports:
      # Loopback only (O02). Never publish on 0.0.0.0.
      - '127.0.0.1:7420:7420'
    volumes:
      # The data volume. Before the rename it was tasklite-data, which is never touched
      # automatically: the README, "Moving from Task Lite", copies it into docket-data
      # with one command (or keeps using it).
      - docket-data:/data
      # Opt-in extra backup location (owner decision 24). Uncomment, then set
      # DOCKET_BACKUP_EXTRA_DIR=/backups-extra in .env. The folder must exist and be
      # writable by uid 10001 (Linux: sudo chown 10001:10001 ~/DocketBackups).
      # See the README, "Backups and restore".
      # - ~/DocketBackups:/backups-extra
      # Opt-in push install of agent files (owner decision 29; Settings > Agent setup >
      # Push folder). Uncomment and put your code folder (the one that holds your repos)
      # on the left, then set in .env:
      #   DOCKET_PUSH_ROOT=/host-code
      #   DOCKET_PUSH_HOST_PATH=<the same folder, as on the left>
      # Docket writes there only the skill folders, its manifest and the marked Docket
      # section of AGENTS.md or CLAUDE.md, and deletes nothing but the old tasklite-* skill
      # folders it installed itself, while unmodified. Without it, Install
      # gives you a command to paste instead. On Linux the folder must be writable by uid 10001.
      # - ~/code:/host-code
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.DOCKET_PORT||process.env.TASKLITE_PORT||7420)+'/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3

volumes:
  docket-data:
    name: docket-data
