# E2E only (B24, US13): turns on the opt-in push install for the end-to-end tests, with a
# push root inside the container (/tmp/host-code), so no host folder or permissions are
# involved. The US13 install spec creates the folder with `docker exec`, installs into it,
# edits the files and checks them. Never for a real install: mount a real folder instead
# (see the commented example in compose.yaml).
services:
  tasklite:
    environment:
      TASKLITE_PUSH_ROOT: /tmp/host-code
      TASKLITE_PUSH_HOST_PATH: C:/Users/owner/code
