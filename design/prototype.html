    undoable(before, `Answer posted to ${v}. ${i.question.by} reads it on its next query.`);
  },
  promote: v => { const before = snap(), i = byId[v]; i.status = 'ready'; logActivity(v, 'You moved the item from Planning to Ready'); undoable(before, `${v} moved to Ready. Agents can claim it now.`); },
  toplanning: v => { const before = snap(); byId[v].status = 'planning'; logActivity(v, 'You moved the item from Inbox to Planning'); undoable(before, `${v} moved to Planning.`); },
  bulkready: v => { const before = snap(), its = items.filter(i => (i.labels || []).includes(v) && i.status === 'planning');
    its.forEach(i => { i.status = 'ready'; logActivity(i.id, `You moved the item to Ready with everything labelled ${v}`); });
    undoable(before, `${its.length} item${its.length===1?'':'s'} labelled ${v} moved to Ready.`); },
  mode: v => { S.workMode = v; render(); },
  filter: v => { S.filter = v; if (v==='blocked') S.showBlocked = true; render(); },
  toggleblocked: () => { S.showBlocked = !S.showBlocked; render(); },
  tab: v => { S.tab = v; render(); },
  planhistory: () => { S.modal = {type:'plan'}; render(); },
  release: v => { S.modal = {type:'release', id:v}; render(); },
  confirmrelease: v => {
    const before = snap(), i = byId[v];
    i.lead = null; i.run = null; i.status = 'ready';
    Object.assign(DETAIL[v].runs[0], {r:'interrupted', what:'Lead run r-58 · interrupted by you at 11:00 · partial work kept', lead:false});
    logActivity(v, 'You released the lead claim; run r-58 marked interrupted'); S.modal = null;
    undoable(before, `${v} is back in Ready. Run r-58 marked interrupted.`);
  },
  toready: v => { const before = snap(), i = byId[v]; i.lead = null; i.run = null; i.status = 'ready'; DETAIL[v].runs[0].lead = false;
    logActivity(v, 'You returned the item to Ready after the failed run'); undoable(before, `${v} returned to Ready.`); },
  packet: v => go('review', {pk:v, pkRound:null}),
  pkround: v => { S.pkRound = +v; render(); },
  verdict: v => { const [n, k] = v.split('|'), m = S.verdicts[S.pk] = S.verdicts[S.pk] || {}; m[n] = Object.assign(m[n] || {into:'checklist', follow:'ticket'}, {k}); render(); },
  mkfollow: v => { const [id, n] = v.split('|'), i = byId[id], h = hrOf(i)[+n], before = snap(), nid = nextId(i.proj);
    items.push({id:nid, type:'Task', title:'Verify: ' + (h.t.length > 60 ? h.t.slice(0, 58) + '…' : h.t), status:'inbox', prio:i.prio, proj:i.proj, epic:i.epic, relates:[id], fromReview:`${id} · deferred item`, last:'now', hr:[{t:h.t, state:'declared'}]});
    reindex(); h.last = Object.assign(h.last || {round:1, deferred:true}, {ref:nid}); logActivity(id, `You created test ticket ${nid} for a deferred review item`);
    undoable(before, `Created test ticket ${nid} in Inbox.`); },
  follow: v => { const [n, k] = v.split('|'); S.verdicts[S.pk][n].follow = k; render(); },
  refresh: v => { const before = snap(), i = byId[v]; hrOf(i).forEach(h => { if (h.state === 'ready') h.state = 'declared'; }); i.status = 'progress'; i.run = 'reported'; i.age = 'now';
    logActivity(v, `You asked ${i.lead} for a fresh packet built from ${i.head}`); undoable(before, `Asked ${i.lead} for a fresh packet. ${v} is back in progress until it arrives.`); },
  into: v => { const [n, k] = v.split('|'); S.verdicts[S.pk][n].into = k; render(); },
  submitpacket: () => {
    const id = S.pk, i = byId[id], v = S.verdicts[id] || {}, pending = hrOf(i).filter(h => h.state === 'ready');
    if (pending.some((h, n) => !v[n] || !v[n].k)){ toast('Decide every item first.'); return; }
    const missing = pending.findIndex((h, n) => v[n].k === 'changes' && !(S.text[`note-${id}-${n}`] || '').trim());
    if (missing >= 0){ toast('Say what needs to change so the agent can fix it.'); const t = $('#note-' + missing); if (t) t.focus(); return; }
    const before = snap(), r = curPacket(id), made = [];
    r.items = pending.map(h => h.t);
    r.decided = {when:'Nov 6 11:00', verdicts: pending.map((h, n) => ({k:v[n].k, note:(S.text[`note-${id}-${n}`] || '').trim(), into:v[n].into || 'checklist', follow:v[n].follow || 'ticket'}))};
    pending.forEach((h, n) => { const x = r.decided.verdicts[n];
      if (x.k === 'approve'){ h.state = 'approved'; h.at = r.commit || i.head || null; return; }
      if (x.k === 'defer'){ h.state = 'deferred'; h.last = {round:r.n, note:x.note, deferred:true};
        if (x.follow === 'ticket'){ const nid = nextId(i.proj);
          items.push({id:nid, type:'Task', title:'Verify: ' + (h.t.length > 60 ? h.t.slice(0, 58) + '…' : h.t), status:'inbox', prio:i.prio, proj:i.proj, epic:i.epic, relates:[id], fromReview:`${id} · round ${r.n}`, last:'now', hr:[{t:h.t, state:'declared'}]});
          reindex(); x.ref = nid; h.last.ref = nid; made.push(`test ticket ${nid}`);
        } else made.push('deferred to the project workflow');
        return; }
      h.state = 'declared'; h.last = {round:r.n, note:x.note};
      if (x.into === 'bug'){ const nid = nextId(i.proj);
        items.push({id:nid, type:'Bug', title:x.note.length > 70 ? x.note.slice(0, 68) + '…' : x.note, status:'ready', prio:i.prio, proj:i.proj, epic:i.epic, labels:['regression'], relates:[id], fromReview:`${id} · round ${r.n}`, last:'now', hr:[]});
        reindex(); x.ref = nid; h.last.ref = nid; made.push(nid);
      } else { DETAIL[id] = DETAIL[id] || {}; (DETAIL[id].work = DETAIL[id].work || []).push({s:'todo', t:x.note, from:`your review, round ${r.n}`}); made.push('checklist item'); }
    });
    const anyCh = r.decided.verdicts.some(x => x.k === 'changes'), nDef = r.decided.verdicts.filter(x => x.k === 'defer').length;
    delete S.verdicts[id];
    const newer = hrOf(i).filter(h => h.state === 'declared').length;
    if (!anyCh && newer){
      i.status = 'progress'; i.round = r.n + 1; i.run = 'reported'; i.age = 'now';
      logActivity(id, `You approved packet round ${r.n}; ${newer} newer review item${newer === 1 ? '' : 's'} still to come`);
      undoable(before, `Round ${r.n} approved. ${newer} newer review item${newer === 1 ? ' is' : 's are'} still to come, so ${id} stays open.`); return;
    }
    if (!anyCh){
      i.status = 'done'; i.closedBy = 'owner'; i.run = 'finished';
      logActivity(id, `You closed the ticket after packet round ${r.n}${nDef ? ` (${nDef} item${nDef===1?'':'s'} deferred, not verified)` : ''}`);
      undoable(before, `${id} closed${nDef ? ` with ${nDef} deferred (${made.join(', ')})` : ''}.${dependents(id).length ? ' ' + dependents(id).map(x => x.id).join(', ') + ' unblocked.' : ''}`);
      return;
    }
    i.status = 'progress'; i.round = r.n + 1; i.run = 'reported'; i.age = 'now';
    logActivity(id, `You sent round ${r.n} back: ${made.join(', ')}`);
    undoable(before, `Sent back to ${i.lead || 'the agent'}: ${made.join(', ')}. You'll get round ${r.n + 1}.`);
  },
  gfix: v => openTicket(v, 'deps'),
  inspect: v => openTicket(v, 'activity'),
  epictab: v => { S.epicTab = v; render(); },
  archive: v => { const before = snap(); byId[v].arch = true; undoable(before, `${v} archived. It's still in the tracker; find it with search or the Archived filter.`); },
  unarchive: v => { const before = snap(); byId[v].arch = false; undoable(before, `${v} is back in your views.`); },
  archiveall: v => { const ids = v.split(',').filter(Boolean); if (!ids.length) return; const before = snap(); ids.forEach(id => { byId[id].arch = true; }); undoable(before, `Archived ${ids.length} done item${ids.length === 1 ? '' : 's'}.`); },
  togglearch: () => { S.showArch = !S.showArch; render(); },
  sectog: v => { S.collapsed[v] = !S.collapsed[v]; render(); },
  epicmap: v => openTicket(v, 'map'),
  tabgo: v => openTicket(v),
  tabclose: v => { const n = S.openTabs.indexOf(v), active = S.view === 'ticket' && S.ticket === v; S.openTabs.splice(n, 1); delete S.tabMem[v];
    if (!active) { render(); return; }
    const next = S.openTabs[Math.min(n, S.openTabs.length - 1)]; if (next) openTicket(next); else go(S.lastPage || 'attention'); },
  mapzoom: v => { const cur = S.mapZ || 1;
    if (v === 'fit') S.mapZoom = S.mapZoom === 'fit' ? 1 : 'fit';
    else if (v === 'reset') S.mapZoom = 1;
    else { const k = ZOOMS.findIndex(z => z >= cur - 0.001); S.mapZoom = v === 'in' ? ZOOMS[Math.min(ZOOMS.length - 1, (ZOOMS[k] > cur + 0.001 ? k : k + 1))] : ZOOMS[Math.max(0, k - 1)]; }
    render(); },
  mappan: v => { const c = document.querySelector('#app .pframe .pcanvas'); const f = document.activeElement && document.activeElement.closest && document.activeElement.closest('.pframe');
    const cv = (f && f.querySelector('.pcanvas')) || c; if (!cv) return;
    cv.scrollBy({left: v === 'r' ? 320 : v === 'l' ? -320 : 0, top: v === 'd' ? 240 : 0, behavior:'smooth'}); },
  rmlink: v => { const [b, a] = v.split('>'), before = snap(), i = byId[a]; i.blockedBy = i.blockedBy.filter(x => x !== b); logActivity(a, `You removed link “${b} blocks ${a}”`); undoable(before, `Removed “${b} blocks ${a}”. Cycle resolved.`); },
  fc: () => { S.fcPreview = !S.fcPreview; render(); },
  snippet: v => { S.snippet = v; render(); },
  copy: () => { const t = $('#snip').textContent; const p = navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject(); p.then(() => toast('Copied to clipboard.'), () => toast('Copy is blocked here. Select the text instead.')); },
  delproj: v => { S.modal = {type:'delete', key:v, typed:''}; render(); },
  confirmdel: () => { const k = S.modal.key; S.modal = null; render(); toast(`Prototype only: this would delete ${P[k].name} and its documents.`); },
  theme: () => { S.theme = {system:'light', light:'dark', dark:'system'}[S.theme]; const a = $('#app'); if (S.theme==='system') a.removeAttribute('data-theme'); else a.setAttribute('data-theme', S.theme); render(); toast(`Theme: ${S.theme}`); },
  palette: () => { S.modal = {type:'palette', q:'', hi:0}; render(); },
  palopen: v => { S.modal = null; openTicket(v); },
  pallabel: v => { S.modal = null; go('label', {label:v}); },
  palnav: v => { S.modal = null; go(v); },
  close: () => { S.modal = null; render(); },
  closeov: () => { S.modal = null; render(); },
  toastundo: () => { const t = $('#toast'), u = t._undo; t.classList.remove('on'); if (u){ u(); toast('Undone.'); } },
};

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click', e => {
  const app = document.getElementById('app');
  if (!app.contains(e.target)) return;
  if (S.scopeOpen && !e.target.closest('.scopewrap')){ S.scopeOpen = false; render(); }
  if (e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'checkbox')) return;
  if (el.dataset.a === 'closeov' && e.target !== el) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.tagName === 'TR' && e.target.closest('a')) return;
  const fn = ACT[el.dataset.a]; if (fn) fn(el.dataset.v);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.a === 'prio'){ const before = snap(), i = byId[S.ticket], old = i.prio; i.prio = +el.value; logActivity(i.id, `You changed priority P${old} → P${i.prio}`); undoable(before, `Priority set to P${i.prio}. Agents see it on their next query.`); }
  if (el.dataset.a === 'epicf'){ S.epicF = el.value; render(); }
  if (el.dataset.a === 'newf'){ S.newF[el.dataset.v] = el.value; if (el.dataset.v === 'proj'){ S.newF.epic = ''; render(); } }
  if (el.dataset.a === 'labelf'){ S.labelF = el.value; render(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.t) S.text[el.dataset.t] = el.value;
  if (el.id === 'palq'){ S.modal.q = el.value; S.modal.hi = 0; render(); }
  if (el.id === 'deltype'){ S.modal.typed = el.value; render(); }
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName, typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)){ e.preventDefault(); ACT.palette(); return; }
  if (e.key === 'Escape' && S.modal){ e.preventDefault(); ACT.close(); return; }
  if (S.scopeOpen && e.key === 'Escape'){ S.scopeOpen = false; render(); const b = document.querySelector('.scopebtn'); if (b) b.focus(); return; }
  if (S.scopeOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    const opts = [...document.querySelectorAll('.scopemenu button')], n = opts.indexOf(document.activeElement);
    e.preventDefault(); opts[(n + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length].focus(); return;
  }
  if (S.modal && S.modal.type === 'palette' && ['ArrowDown','ArrowUp','Enter'].includes(e.key)){
    const btns = [...document.querySelectorAll('.pal .pi')]; if (!btns.length) return;
    e.preventDefault();
    if (e.key === 'Enter'){ btns[S.modal.hi || 0].click(); return; }
    S.modal.hi = ((S.modal.hi || 0) + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length; render(); return;
  }
  if (S.modal && e.key === 'Tab'){
    const f = [...document.querySelectorAll('.dlg button:not([disabled]),.dlg input,.dlg textarea')]; if (!f.length) return;
    const first = f[0], last = f[f.length-1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    return;
  }
  const t = e.target;
  if (e.key === 'Enter' && t.matches && t.matches('.addrow .input')){ e.preventDefault(); const b = t.parentElement.querySelector('button'); if (b) b.click(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role=button]:not(button)')){ e.preventDefault(); t.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
  if (t.getAttribute && t.getAttribute('role') === 'tab' && ['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
    const tabs = [...t.parentElement.querySelectorAll('[role=tab]')], n = tabs.indexOf(t);
    const next = e.key==='Home' ? 0 : e.key==='End' ? tabs.length-1 : (n + (e.key==='ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    e.preventDefault(); if (t.dataset.a === 'epictab'){ S.epicTab = tabs[next].dataset.v; render(); const ne = document.getElementById('etab-'+S.epicTab); if (ne) ne.focus(); return; }
    S.tab = tabs[next].dataset.v; render(); const nt = document.getElementById('tab-'+S.tab); if (nt) nt.focus();
  }
});
let drag = null;
document.addEventListener('pointerdown', e => { const c = e.target.closest && e.target.closest('.pcanvas'); if (!c || e.target.closest('.pnode') || e.button !== 0) return;
  drag = {c, x:e.clientX, y:e.clientY, l:c.scrollLeft, t:c.scrollTop}; c.classList.add('dragging'); });
document.addEventListener('pointermove', e => { if (!drag) return; drag.c.scrollLeft = drag.l - (e.clientX - drag.x); drag.c.scrollTop = drag.t - (e.clientY - drag.y); });
document.addEventListener('pointerup', () => { if (drag){ drag.c.classList.remove('dragging'); drag = null; } });
document.addEventListener('scroll', e => { if (e.target && e.target.classList && e.target.classList.contains('pcanvas')) mapCues(e.target); }, true);
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(drawMaps, 80); });
document.addEventListener('mouseover', e => { const n = e.target.closest && e.target.closest('.pmap .pnode'); document.querySelectorAll('#app .pmap .hl').forEach(x => x.classList.remove('hl')); if (!n) return;
  const id = n.dataset.pid, m = n.closest('.pmap'); n.classList.add('hl');
  m.querySelectorAll(`.pe[data-from="${id}"],.pe[data-to="${id}"]`).forEach(pe => { pe.classList.add('hl'); const o = pe.dataset.from === id ? pe.dataset.to : pe.dataset.from; const on = m.querySelector(`[data-pid="${o}"]`); if (on) on.classList.add('hl'); }); });
const mq = matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', () => { if (S.theme === 'system') render(); });

/* Test hook: ?selftest renders every view and item in each scope and reports errors in the page title. */
if (/selftest/.test(location.search)){
  const errs = [];
  const tryR = (label, f) => { try { f(); render(); } catch(err){ errs.push(label + ': ' + err.message); } };
  ['all','RCP','DOC'].forEach(sc => Object.keys(TITLES).forEach(v => tryR(sc+'/'+v, () => { S.scope = sc; S.view = v; })));
  S.scope = 'all';
  items.forEach(i => ['details','checklist','deps','map','activity'].forEach(t => tryR(i.id+'/'+t, () => { S.view = 'ticket'; S.ticket = i.id; S.epicTab = t; })));
  Object.keys(LABELS).forEach(l => tryR('label/'+l, () => { S.view = 'label'; S.label = l; }));
  Object.keys(PACKETS).forEach(id => PACKETS[id].rounds.forEach(r => tryR('packet/'+id+'/'+r.n, () => { S.view = 'review'; S.pk = id; S.pkRound = r.n; })));
  ['board','list','map'].forEach(m => ['all','RCP','DOC'].forEach(sc => tryR('work/'+m+'/'+sc, () => { S.modal = null; S.view = 'work'; S.workMode = m; S.scope = sc; }))); S.scope = 'all';
  ['map','details','activity'].forEach(m => ['RCP-1','RCP-2','DOC-10'].forEach(id => tryR('epic/'+m+'/'+id, () => { S.view = 'ticket'; S.ticket = id; S.epicTab = m; })));
  ['palette','plan','release','delete'].forEach(m => tryR('modal/'+m, () => { S.view = 'ticket'; S.ticket = 'RCP-14'; S.modal = m==='delete' ? {type:m, key:'RCP'} : {type:m, id:'RCP-15', q:'rcp'}; }));
  tryR('modal/new', () => { S.modal = {type:'new'}; });
  tryR('modal/newin', () => { S.newF = {type:'Story', proj:'RCP', epic:'RCP-1', fromEpic:'RCP-1'}; S.modal = {type:'new'}; });
  tryR('hredit', () => { S.modal = null; S.view = 'ticket'; S.ticket = 'RCP-14'; S.hrEdit = 'RCP-14|0'; }); S.hrEdit = null;
  tryR('tabs', () => { S.openTabs = ['RCP-1','RCP-14','DOC-4']; S.view = 'ticket'; S.ticket = 'RCP-14'; }); S.openTabs = [];
  ['meal-templates-prd.md','meal-templates-ux.md','meal-templates-tdd.md','pantry-brief.md','drag-phone.mp4','axe-report.json','notes.md'].forEach(n => tryR('doc/'+n, () => { S.modal = {type:'doc', name:n, ver:'v1', by:'claude', when:'now'}; }));
  tryR('fc', () => { S.modal = null; S.view = 'timeline'; S.fcPreview = true; });
  Object.keys(FILTERS).forEach(f => ['board','list'].forEach(m => tryR('filter/'+f+'/'+m, () => { S.view = 'work'; S.filter = f; S.workMode = m; })));
  tryR('scopemenu', () => { S.scopeOpen = true; }); S.scopeOpen = false;
  S.modal = null; S.view = 'attention'; S.filter = 'all'; S.workMode = 'board'; S.fcPreview = false; S.scope = 'all'; S.pkRound = null; render();
  document.title = errs.length ? 'SELFTEST FAIL ' + errs.join(' | ') : 'SELFTEST OK';
} else render();
})();
</script>
