/* =====================================================================
   Modals
   ===================================================================== */
function modalHtml(){
  const m = S.modal; if (!m) return '';
  const wrap = (title, body, foot) => `<div class="ov" data-a="closeov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt">
    <header><h2 id="dlgt">${title}</h2><button class="iconbtn" data-a="close" aria-label="Close">${I.x}</button></header>
    <div class="body">${body}</div>${foot ? `<footer>${foot}</footer>` : ''}</div></div>`;
  if (m.type === 'palette'){
    const q = (m.q || '').trim().toLowerCase();
    const views = [['attention','Needs you'],['work','Work'],['reviews','Reviews'],['graph','Dependencies'],['timeline','Timeline'],['agents','Agents'],['connections','Connections'],['projects','Projects']];
    const its = items.filter(i => !q || i.id.toLowerCase().includes(q) || i.title.toLowerCase().includes(q)).slice(0, 8);
    const vs = views.filter(v => !q || v[1].toLowerCase().includes(q));
    let n = 0; const hi = () => (n++ === (m.hi || 0)) ? ' hi' : '';
    const res = `${its.length ? `<div class="grp">Work items</div>${its.map(i => `<button class="pi${hi()}" data-a="palopen" data-v="${i.id}"><span class="mono muted" style="width:56px">${i.id}</span><span class="grow">${esc(i.title)}</span><span class="src">${P[i.proj].short}</span>${statusChip(i)}</button>`).join('')}` : ''}
      ${vs.length ? `<div class="grp">Go to</div>${vs.map(v => `<button class="pi${hi()}" data-a="palnav" data-v="${v[0]}"><span class="grow">${v[1]}</span></button>`).join('')}` : ''}`;
    return `<div class="ov" data-a="closeov"><div class="dlg pal" role="dialog" aria-modal="true" aria-label="Search or jump to">
      <input id="palq" placeholder="Search items, IDs, or views…" value="${esc(m.q || '')}" aria-label="Search" autocomplete="off">
      <div class="res">${res.trim() || '<div class="pad muted">No matches in the sample data.</div>'}</div>
      <div class="pad src" style="border-top:1px solid var(--line)">↑↓ to move · Enter to open · Esc to close</div></div></div>`;
  }
  if (m.type === 'plan'){
    const d = DETAIL[S.ticket];
    return wrap(`Plan history · ${S.ticket}`, `<div class="hv">${[...d.history].reverse().map(h => `<div class="ver"><div class="row" style="justify-content:space-between"><b>v${h.v}</b><span class="src">${h.by} · ${h.at}</span></div><div class="src" style="margin:2px 0 6px">${esc(h.note)}</div>${h.ops.map(o => `<div class="${o[0]==='+'?'add':o[0]==='-'?'rm':''}">${o[0]==='=' ? '' : o[0]+' '}${esc(o[1])}</div>`).join('')}</div>`).join('')}</div>
      <div class="src" style="margin-top:10px">Earlier versions are kept so you can see how scope changed without reading a transcript.</div>`, '<button class="btn" data-a="close">Close</button>');
  }
  if (m.type === 'release'){
    return wrap(`Release lead claim on ${m.id}?`, `<p style="margin-top:0">codex · orca-w1 has been silent for 47 minutes. Releasing will:</p>
      <ul style="margin:0 0 8px;padding-left:18px"><li>mark run r-58 as <b>interrupted</b>, not finished</li><li>keep its plan, log and partial work on the ticket</li><li>move ${m.id} back to Ready so another agent can claim it</li></ul>
      <div class="src">If codex comes back, it gets a conflict response with the current state.</div>`,
      `<button class="btn" data-a="close">Cancel</button><button class="btn danger" data-a="confirmrelease" data-v="${m.id}">Release claim</button>`);
  }
  if (m.type === 'types'){
    const pr = P[m.key], ts = typesFor(m.key), nt = S.newType;
    const DOCS3 = ['PRD','UX','TDD'];
    return wrap(`Item types · ${esc(pr.short)}`, `<p class="src" style="margin-top:0">Containers can be parents (Epic → Feature → work item). Planning-doc defaults are shown on Planning items and returned to agents over MCP. They're <b>defaults, not rules</b>: your repo's agent workflow decides when to skip them.</p>
      <table class="typetbl"><thead><tr><th scope="col">Type</th><th scope="col">Kind</th><th scope="col">Planning docs (default)</th><th scope="col">Source</th></tr></thead><tbody>
      ${Object.entries(ts).map(([k,t]) => `<tr><td><span class="ti">${t.icon}</span> <b>${k}</b><div class="src">${esc(t.desc || '')}</div></td><td class="src">${t.container ? 'Container' : 'Work item'}</td>
        <td>${DOCS3.map(d => `<label class="row" style="display:inline-flex;gap:3px;margin-right:6px;font-size:12px"><input type="checkbox" data-a="ruledoc" data-v="${m.key}|${k}|${d}" ${(pr.readyRules[k] || []).includes(d) ? 'checked' : ''}>${d}</label>`).join('')}</td>
        <td class="src">${TYPES[k] ? 'Built-in' : 'Custom'}</td></tr>`).join('')}</tbody></table>
      <h3 style="margin-top:14px">Add a custom type</h3>
      <div class="row wrap" style="align-items:flex-end">
        <label style="flex:1;min-width:140px"><span class="f" style="margin-top:0">Name</span><input class="input" id="nt-name" data-t="nt-name" value="${esc(S.text['nt-name'] || '')}" placeholder="e.g. Research, Chore, Experiment"></label>
        <label style="width:70px"><span class="f" style="margin-top:0">Icon</span><input class="input" id="nt-icon" data-t="nt-icon" maxlength="2" value="${esc(S.text['nt-icon'] || '')}" placeholder="◇"></label>
        <label class="row" style="gap:4px;padding-bottom:6px"><input type="checkbox" data-a="ntcont" ${nt.container ? 'checked' : ''}> Can contain items</label>
        <button class="btn primary" data-a="addtype" data-v="${m.key}">Add type</button></div>`,
      '<button class="btn" data-a="close">Done</button>');
  }
  if (m.type === 'delete'){
    const p = P[m.key], n = items.filter(i => i.proj===m.key).length, ok = (m.typed || '') === m.key;
    return wrap(`Delete ${esc(p.name)}?`, `<p style="margin-top:0">This permanently removes <b>${n} work items</b>, their plans, runs and history, and <b>${p.docs} local documents</b>. Agents will get “not found” for these IDs.</p>
      <div class="callout warn">Backups keep a copy until their 14-day retention ends. Removing the Docker container alone doesn't delete data.</div>
      <label class="f" for="deltype">Type <b class="mono">${m.key}</b> to confirm</label><input class="input" id="deltype" value="${esc(m.typed || '')}" autocomplete="off">`,
      `<button class="btn" data-a="close">Cancel</button><button class="btn danger" data-a="confirmdel" ${ok ? '' : 'disabled'}>Delete project</button>`);
  }
  return '';
}

/* =====================================================================
   Render loop (keeps keyboard focus on the same control across renders)
   ===================================================================== */
const TITLES = {attention:'Needs you', work:'Work', reviews:'Reviews', graph:'Dependencies', timeline:'Timeline', agents:'Agents', connections:'Connections', projects:'Projects'};
const fkey = el => (el && el.dataset) ? (el.dataset.a ? `${el.dataset.a}|${el.dataset.v || ''}` : el.dataset.t ? `t|${el.dataset.t}` : el.id ? `#${el.id}` : null) : null;
function render(){
  const ae = document.activeElement, k = fkey(ae);
  const caret = ae && typeof ae.selectionStart === 'number' ? ae.selectionStart : null;
  renderNav();
  $('#view').innerHTML = V[S.view]();
  const i = byId[S.ticket];
  const globalView = S.view === 'connections' || S.view === 'projects';
  $('#crumbs').innerHTML = S.view === 'ticket' ? `<span>${P[i.proj].short}</span> / <a href="#" data-a="nav" data-v="work">Work</a> / <span class="mono">${i.id}</span> <b>${esc(i.title)}</b>`
    : globalView ? `<b>${TITLES[S.view]}</b> <span class="scopebar">Service-wide</span>` : `<span>${S.scope === 'all' ? 'All projects' : P[S.scope].short}</span> / <b>${TITLES[S.view]}</b>`;
  const dark = S.theme==='dark' || (S.theme==='system' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themebtn').innerHTML = dark ? I.sun : I.moon;
  $('#themebtn').setAttribute('aria-label', `Theme: ${S.theme}. Switch theme`);
  $('#themebtn').title = `Theme: ${S.theme}`;
  $('#modal').innerHTML = modalHtml();
  if (S.modal){
    const keep = S.modal.type==='types' && document.activeElement && document.activeElement.closest && document.activeElement.closest('.dlg') ? null : 1;
    const f = S.modal.type==='palette' ? $('#palq') : S.modal.type==='delete' ? $('#deltype') : S.modal.type==='types' ? ((k && [...document.querySelectorAll('.dlg [data-a],.dlg [data-t]')].find(e => fkey(e) === k)) || $('.dlg [data-a=close]')) : $('.dlg footer .btn');
    if (f){ f.focus(); if (f.type !== 'checkbox' && typeof f.value === 'string' && f.setSelectionRange) try { f.setSelectionRange(f.value.length, f.value.length); } catch(_){} }
    return;
  }
  if (k){
    const el = [...document.querySelectorAll('#app [data-a],#app [data-t],#app [id]')].find(e => fkey(e) === k);
    if (el){ el.focus({preventScroll:true}); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch(_){} }
  }
}
function go(view, opts={}){
  Object.assign(S, opts); S.view = view; render();
  $('#view').focus({preventScroll:true});
}
function openTicket(id){ S.ticket = id; S.tab = null; go('ticket'); }
function openReview(id){ S.review = id; S.ver = null; S.decision = null; go('reviews'); }
function undoable(id, msg, undo){ render(); toast(msg, () => { undo(); S.extraActivity[id]?.shift(); render(); }); }

/* =====================================================================
   Actions
   ===================================================================== */
const ACT = {
  nav: v => go(v),
  open: v => openTicket(v),
  projwork: v => { S.scope = v; go('work', {filter:'all'}); },
  scope: v => { S.scope = v; S.scopeOpen = false; S.kpi = 'all'; if (S.view === 'projects') go('attention'); else render(); toast(v === 'all' ? 'Showing all projects.' : `Showing only ${P[v].short}.`); },
  scopemenu: () => { S.scopeOpen = !S.scopeOpen; render(); if (S.scopeOpen) setTimeout(() => { const b = document.querySelector('.scopemenu [aria-checked=true]'); if (b) b.focus(); }, 0); },
  promote: v => { const i = byId[v], miss = missingDocs(i); i.status = 'ready'; logActivity(v, miss.length ? `Owner moved the item to Ready without ${miss.join(', ')}` : 'Owner moved the item from Planning to Ready');
    undoable(v, `${v} moved to Ready. Agents can claim it now.`, () => { i.status = 'planning'; }); },
  toplanning: v => { const i = byId[v]; i.status = 'planning'; i.planning = i.planning || {}; logActivity(v, 'Owner moved the item from Inbox to Planning');
    undoable(v, `${v} moved to Planning.`, () => { i.status = 'inbox'; }); },
  kpi: v => { S.kpi = v; render(); },
  reply: v => { S.replyOpen = S.replyOpen === v ? null : v; render(); setTimeout(() => $('#ans-'+v)?.focus(), 0); },
  sendanswer: v => {
    const t = (S.text['ans-'+v] || '').trim();
    if (!t){ toast('Write an answer first.'); return; }
    const i = byId[v]; i.question.answer = t; S.replyOpen = null; logActivity(v, `Owner answered: “${t}”`);
    undoable(v, `Answer posted to ${v}. ${i.question.by} reads it on its next query.`, () => { delete i.question.answer; });
  },
  mode: v => { S.workMode = v; render(); },
  filter: v => { S.filter = v; if (v==='blocked') S.showBlocked = true; render(); },
  toggleblocked: () => { S.showBlocked = !S.showBlocked; render(); },
  tab: v => { S.tab = v; render(); },
  planhistory: () => { S.modal = {type:'plan'}; render(); },
  release: v => { S.modal = {type:'release', id:v}; render(); },
  confirmrelease: v => {
    const i = byId[v], prev = {lead:i.lead, run:i.run, status:i.status}, r0 = {...DETAIL[v].runs[0]};
    i.lead = null; i.run = null; i.status = 'ready';
    Object.assign(DETAIL[v].runs[0], {r:'interrupted', what:'Lead run r-58 · interrupted by owner at 11:00 · partial work kept', lead:false});
    logActivity(v, 'Owner released the lead claim; run r-58 marked interrupted'); S.modal = null;
    undoable(v, `${v} is back in Ready. Run r-58 marked interrupted.`, () => { Object.assign(i, prev); Object.assign(DETAIL[v].runs[0], r0); });
  },
  toready: v => {
    const i = byId[v], prev = {lead:i.lead, run:i.run, status:i.status};
    i.lead = null; i.run = null; i.status = 'ready'; DETAIL[v].runs[0].lead = false;
    logActivity(v, 'Owner returned the item to Ready after the failed run');
    undoable(v, `${v} returned to Ready.`, () => { Object.assign(i, prev); DETAIL[v].runs[0].lead = true; });
  },
  ack: v => { S.ackEvidence[v] = true; logActivity(v, 'Owner accepted the agent completion without further evidence'); undoable(v, 'Accepted. Removed from Needs you.', () => { delete S.ackEvidence[v]; }); },
  reopen: v => { const i = byId[v]; i.status = 'ready'; S.ackEvidence[v] = true; logActivity(v, 'Owner reopened the item: acceptance #2 needs evidence');
    undoable(v, `${v} reopened and back in Ready.`, () => { i.status = 'done'; delete S.ackEvidence[v]; }); },
  review: v => openReview(v),
  ver: v => { S.ver = +v; render(); },
  diff: () => { S.diff = !S.diff; render(); },
  dec: v => { S.decision = v; render(); },
  submitdec: () => {
    const why = (S.text['rat-'+S.review] || '').trim();
    if (S.decision !== 'approve' && !why){ toast('Add a reason so the agent knows what to do next.'); $('#rat')?.focus(); return; }
    const id = S.review, k = S.decision, it = byId[id], pd = REVIEWS[id].planDoc;
    S.undoDec = {status:it.status, closedBy:it.closedBy, doc: pd ? it.planning[pd] : null};
    S.decided[id] = k; S.decision = null;
    if (pd){
      if (k === 'approve' || k === 'waive') it.planning[pd] = 'approved';
      if (k === 'changes') it.planning[pd] = 'drafting';
      logActivity(id, `Owner ${({approve:'approved', changes:'requested changes on', defer:'deferred', waive:'waived'})[k]} the ${pd} doc${why ? `: “${why}”` : ''}`);
      undoable(id, `${DEC[k][3]} on ${id} ${pd}. Agents see it on their next query.`, () => ACT.restoreDec(id));
      return;
    }
    if (k === 'approve'){ it.status = 'done'; it.closedBy = 'owner'; logActivity(id, it.gate ? `Owner approved gate “${it.gate}”` : 'Owner approved v2'); }
    if (k === 'changes'){ it.status = 'progress'; logActivity(id, `Owner requested changes: “${why}”`); }
    if (k === 'defer') logActivity(id, `Owner deferred the decision: “${why}”`);
    if (k === 'waive'){ it.status = 'done'; it.closedBy = 'owner'; logActivity(id, `Owner waived the review: “${why}”`); }
    undoable(id, `${DEC[k][3]} on ${id}. Agents see it on their next query.`, () => ACT.restoreDec(id));
  },
  restoreDec: id => { const it = byId[id], u = S.undoDec || {}, pd = REVIEWS[id].planDoc; delete S.decided[id]; it.status = u.status || it.status; if (u.closedBy) it.closedBy = u.closedBy; else delete it.closedBy; if (pd) it.planning[pd] = u.doc || 'review'; },
  undodec: () => { const id = S.review; ACT.restoreDec(id); S.extraActivity[id]?.shift(); render(); },
  check: v => { S.checks[v] = !S.checks[v]; render(); },
  download: v => { const b = new Blob([DOCS[v]], {type:'text/markdown'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `recipe-data-model.v${v}.md`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); },
  gsel: v => { S.graphSel = v; render(); },
  gfocus: v => { if (!GN[v]){ toast(`${v} has no blocking links to show.`); return; } go('graph', {graphSel:v}); },
  gfix: v => go('graph', {graphSel:v}),
  grel: () => { S.gRel = !S.gRel; if (!S.gRel && S.graphSel === 'RCP-17') S.graphSel = 'RCP-21'; render(); },
  slip: v => { S.slip = +v; render(); },
  rmlink: v => { const [b, a] = v.split('>'); const i = byId[a], prev = [...i.blockedBy]; i.blockedBy = i.blockedBy.filter(x => x !== b); logActivity(a, `Owner removed link “${b} blocks ${a}”`);
    undoable(a, `Removed “${b} blocks ${a}”. Cycle resolved.`, () => { i.blockedBy = prev; }); },
  fc: () => { S.fcPreview = !S.fcPreview; render(); },
  snippet: v => { S.snippet = v; render(); },
  copy: () => { const t = $('#snip').textContent; const p = navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject(); p.then(() => toast('Copied to clipboard.'), () => toast('Copy is blocked here. Select the text instead.')); },
  types: v => { S.modal = {type:'types', key:v}; render(); },
  ntcont: () => { S.newType.container = !S.newType.container; render(); },
  ruledoc: v => { const [k, t, d] = v.split('|'), r = P[k].readyRules[t] = P[k].readyRules[t] || []; const n = r.indexOf(d); if (n >= 0) r.splice(n, 1); else r.push(d); render(); },
  addtype: v => { const name = (S.text['nt-name'] || '').trim().replace(/\s+/g, ' '), icon = (S.text['nt-icon'] || '').trim() || '◇';
    if (!name){ toast('Give the type a name.'); return; }
    if (typesFor(v)[name]){ toast(`${name} already exists in ${P[v].short}.`); return; }
    P[v].customTypes[name] = {icon, container:S.newType.container, desc:'Custom type'}; P[v].readyRules[name] = [];
    S.text['nt-name'] = ''; S.text['nt-icon'] = ''; S.newType = {name:'', icon:'', container:false, docs:{}}; render();
    toast(`Added ${icon} ${name} to ${P[v].short}. Agents see it in the type list over MCP.`, () => { delete P[v].customTypes[name]; delete P[v].readyRules[name]; render(); }); },
  delproj: v => { S.modal = {type:'delete', key:v, typed:''}; render(); },
  confirmdel: () => { const k = S.modal.key; S.modal = null; render(); toast(`Prototype only: this would delete ${P[k].name} and its documents.`); },
  theme: () => { S.theme = {system:'light', light:'dark', dark:'system'}[S.theme]; const a = $('#app'); if (S.theme==='system') a.removeAttribute('data-theme'); else a.setAttribute('data-theme', S.theme); render(); toast(`Theme: ${S.theme}`); },
  palette: () => { S.modal = {type:'palette', q:'', hi:0}; render(); },
  palopen: v => { S.modal = null; openTicket(v); },
  palnav: v => { S.modal = null; go(v); },
  close: () => { S.modal = null; render(); },
  closeov: () => { S.modal = null; render(); },
  toastundo: () => { const t = $('#toast'), u = t._undo; t.classList.remove('on'); if (u){ u(); toast('Undone.'); } },
};

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click', e => {
  const app = document.getElementById('app');
  if (!app.contains(e.target)) return;
  if (e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  if (S.scopeOpen && !e.target.closest('.scopewrap')){ S.scopeOpen = false; render(); }
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'checkbox')) return;
  if (el.dataset.a === 'closeov' && e.target !== el) return; // clicks inside a dialog don't close it
  if (el.tagName === 'A') e.preventDefault();
  const fn = ACT[el.dataset.a]; if (fn) fn(el.dataset.v);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.a === 'prio'){ const i = byId[S.ticket], old = i.prio; i.prio = +el.value; logActivity(i.id, `Owner changed priority P${old} → P${i.prio}`); undoable(i.id, `Priority set to P${i.prio}. Agents see it on their next query.`, () => { i.prio = old; }); }
  if (el.dataset.a === 'typef'){ S.typeF = el.value; render(); }
  if (el.dataset.a === 'readygate'){ const p = P[el.dataset.v], old = p.readyGate; p.readyGate = el.value; render(); toast(`${p.short}: ${p.readyGate === 'agent' ? 'the lead agent may move items to Ready once planning docs are approved' : 'only you move items to Ready'}.`, () => { p.readyGate = old; render(); }); }
  if (el.dataset.a === 'policy'){ const p = P[el.dataset.v], old = p.policy, oldG = [...p.gates]; p.policy = el.value; if (p.policy==='gated' && !p.gates.length) p.gates = ['Release walkthrough'];
    render(); toast(`${p.name}: ${p.policy==='gated' ? 'owner gate required before Done' : 'agent completion now closes items'}.`, () => { p.policy = old; p.gates = oldG; render(); }); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.t) S.text[el.dataset.t] = el.value;
  if (el.id === 'palq'){ S.modal.q = el.value; S.modal.hi = 0; render(); }
  if (el.id === 'deltype'){ S.modal.typed = el.value; render(); }
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName, typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)){ e.preventDefault(); ACT.palette(); return; }
  if (e.key === 'Escape' && S.modal){ e.preventDefault(); ACT.close(); return; }
  if (S.scopeOpen && e.key === 'Escape'){ S.scopeOpen = false; render(); const b = document.querySelector('.scopebtn'); if (b) b.focus(); return; }
  if (S.scopeOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    const opts = [...document.querySelectorAll('.scopemenu button')], n = opts.indexOf(document.activeElement);
    e.preventDefault(); opts[(n + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length].focus(); return;
  }
  if (S.modal && S.modal.type === 'palette' && ['ArrowDown','ArrowUp','Enter'].includes(e.key)){
    const btns = [...document.querySelectorAll('.pal .pi')]; if (!btns.length) return;
    e.preventDefault();
    if (e.key === 'Enter'){ btns[S.modal.hi || 0].click(); return; }
    S.modal.hi = ((S.modal.hi || 0) + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length; render(); return;
  }
  if (S.modal && e.key === 'Tab'){ // focus trap
    const f = [...document.querySelectorAll('.dlg button:not([disabled]),.dlg input,.dlg textarea')]; if (!f.length) return;
    const first = f[0], last = f[f.length-1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    return;
  }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role=button]:not(button)')){ e.preventDefault(); t.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
  if (t.getAttribute && t.getAttribute('role') === 'tab' && ['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
    const tabs = [...t.parentElement.querySelectorAll('[role=tab]')], n = tabs.indexOf(t);
    const next = e.key==='Home' ? 0 : e.key==='End' ? tabs.length-1 : (n + (e.key==='ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    e.preventDefault(); S.tab = tabs[next].dataset.v; render(); const nt = document.getElementById('tab-'+S.tab); if (nt) nt.focus();
  }
});
const mq = matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', () => { if (S.theme === 'system') render(); });

/* Test hook: ?selftest renders every view and item and reports errors in the page title. */
if (/selftest/.test(location.search)){
  const errs = [];
  const tryR = (label, f) => { try { f(); render(); } catch(err){ errs.push(label + ': ' + err.message); } };
  ['all','RCP','DOC'].forEach(sc => Object.keys(TITLES).forEach(v => tryR(sc+'/'+v, () => { S.scope = sc; S.view = v; })));
  tryR('scopemenu', () => { S.scope = 'all'; S.scopeOpen = true; }); S.scopeOpen = false;
  items.forEach(i => ['progress','evidence','activity'].forEach(t => tryR(i.id+'/'+t, () => { S.view = 'ticket'; S.ticket = i.id; S.tab = t; })));
  Object.keys(GN).forEach(id => tryR('graph/'+id, () => { S.view = 'graph'; S.graphSel = id; }));
  Object.keys(REVIEWS).forEach(id => tryR('review/'+id, () => { S.view = 'reviews'; S.review = id; S.ver = 1; }));
  ['palette','plan','release','delete'].forEach(m => tryR('modal/'+m, () => { S.view = 'ticket'; S.ticket = 'RCP-14'; S.modal = m==='delete' ? {type:m, key:'RCP'} : {type:m, id:'RCP-15', q:'rcp'}; }));
  ['board','list','tree'].forEach(m => ['all','RCP','DOC'].forEach(sc => tryR('work/'+m+'/'+sc, () => { S.modal = null; S.view = 'work'; S.workMode = m; S.scope = sc; })));
  tryR('types', () => { S.view = 'projects'; S.scope = 'all'; S.modal = {type:'types', key:'RCP'}; });
  ['RCP-1','RCP-30','RCP-31','DOC-10','RCP-25','RCP-20'].forEach(id => tryR('ticket/'+id, () => { S.modal = null; S.view = 'ticket'; S.ticket = id; S.tab = null; }));
  tryR('fc', () => { S.modal = null; S.view = 'timeline'; S.fcPreview = true; });
  ['work'].forEach(v => Object.keys(FILTERS).forEach(f => tryR('filter/'+f, () => { S.view = v; S.filter = f; S.workMode = 'list'; })));
  S.modal = null; S.view = 'attention'; S.filter = 'all'; S.scope = 'all'; S.workMode = 'board'; S.fcPreview = false; render();
  document.title = errs.length ? 'SELFTEST FAIL ' + errs.join(' | ') : 'SELFTEST OK';
} else render();
})();
</script>
