<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Lite — UI prototype (rev 5)</title>
<!--
  Clickable UI/UX prototype for the local agent work tracker (MVP V1), revision 5.
  Self-contained: no network requests, no build step. All data is disposable sample work (O09).
  Design rationale and requirement mapping: docs/UI_DESIGN.md
-->
<style>
/* ---------- tokens (contrast-checked: text >= 4.5:1, control borders >= 3:1) ---------- */
.tl{
  --bg:#f6f7f9; --panel:#fff; --panel-2:#f1f3f6; --line:#e3e6eb; --line-2:#d3d8df; --ctl:#8a929f;
  --ink:#16191f; --ink-2:#444c59; --ink-3:#5f6878; --on-fill:#fff;
  --brand:#3b5bdb; --brand-soft:#e8edff;
  --ok:#237032; --ok-soft:#e6f4ea; --warn:#9a4705; --warn-soft:#fdf1e2;
  --bad:#c22b2b; --bad-soft:#fdecec; --info:#1864ab; --info-soft:#e7f1fb;
  --violet:#6741d9; --violet-soft:#f0ebff; --gray-soft:#eef0f3; --teal:#0b7285; --teal-soft:#e3f6f8;
  --t-epic:#7b2fa3; --t-story:#2b7a3b; --t-task:#1c64b9; --t-bug:#c92a2a; --t-fg:#fff;
  --shadow:0 12px 40px rgba(20,25,35,.18);
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  font:13px/1.45 var(--sans); color:var(--ink); background:var(--bg); color-scheme:light;
}
.tl[data-theme=dark]{
  --bg:#0f1115;--panel:#161920;--panel-2:#1c2029;--line:#2a303b;--line-2:#363d4a;--ctl:#6f788a;
  --ink:#e6e9ef;--ink-2:#b8c0cc;--ink-3:#99a2b4;--on-fill:#0f1115;
  --brand:#8ea2ff;--brand-soft:#1d2440;--ok:#5bd06f;--ok-soft:#14281a;--warn:#f0a020;--warn-soft:#2d2210;
  --bad:#ff7b7b;--bad-soft:#351818;--info:#5cb3f8;--info-soft:#132536;--violet:#a990ff;--violet-soft:#241c3e;--gray-soft:#23272f;--teal:#3bc9db;--teal-soft:#10292d;--t-epic:#d197f0;--t-story:#6fd384;--t-task:#74b8f7;--t-bug:#ff8a8a;--t-fg:#0f1115;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  .tl:not([data-theme=light]){
    --bg:#0f1115;--panel:#161920;--panel-2:#1c2029;--line:#2a303b;--line-2:#363d4a;--ctl:#6f788a;
    --ink:#e6e9ef;--ink-2:#b8c0cc;--ink-3:#99a2b4;--on-fill:#0f1115;
    --brand:#8ea2ff;--brand-soft:#1d2440;--ok:#5bd06f;--ok-soft:#14281a;--warn:#f0a020;--warn-soft:#2d2210;
    --bad:#ff7b7b;--bad-soft:#351818;--info:#5cb3f8;--info-soft:#132536;--violet:#a990ff;--violet-soft:#241c3e;--gray-soft:#23272f;--teal:#3bc9db;--teal-soft:#10292d;--t-epic:#d197f0;--t-story:#6fd384;--t-task:#74b8f7;--t-bug:#ff8a8a;--t-fg:#0f1115;
    --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
  }
}
.tl *{box-sizing:border-box}
.tl button,.tl select,.tl input,.tl textarea{font:inherit;color:inherit}
.tl button{cursor:pointer}
.tl a{color:var(--brand);text-decoration:none;cursor:pointer}
.tl a:hover{text-decoration:underline}
.tl :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.tl .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tl .mono{font-family:var(--mono);font-size:12px}
.tl a.mono,.tl span.mono{white-space:nowrap}
.tl .muted{color:var(--ink-3)}
.tl .src{font-size:12px;color:var(--ink-3)}
.tl .row{display:flex;align-items:center;gap:8px}
.tl .wrap{flex-wrap:wrap}
.tl .grow{flex:1;min-width:0}
.tl .stack{display:grid;gap:12px;min-width:0}
.tl .stack>*{min-width:0}
.tl .pmapbox,.tl .pframe{min-width:0;max-width:100%}
.tl .grid2{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.tl h1{font-size:19px;margin:0 0 2px;font-weight:650;letter-spacing:-.01em}
.tl h2{font-size:14px;margin:0;font-weight:650}
.tl h3{font-size:11.5px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650}
.tl .sub{color:var(--ink-3);margin:2px 0 14px}
.tl .card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.tl .pad{padding:12px 14px}

/* ---------- shell ---------- */
.tl .shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:820px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.tl .logo{display:flex;align-items:center;gap:8px;font-weight:700;padding:2px 8px 14px}
.tl .logo i{width:24px;height:24px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:var(--on-fill);font-style:normal;font-size:11px;flex:none}
.tl .navbtn{display:flex;align-items:center;gap:10px;min-height:32px;padding:5px 9px;border-radius:7px;border:0;background:none;text-align:left;color:var(--ink-2);width:100%}
.tl .navbtn svg{width:16px;height:16px;flex:none}
.tl .navbtn:hover{background:var(--panel-2)}
.tl .navbtn[aria-current=page]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tl .badge{margin-left:auto;font-size:11px;background:var(--bad);color:var(--on-fill);border-radius:9px;padding:0 6px;font-weight:700;min-width:18px;text-align:center}
.tl .badge.n{background:var(--gray-soft);color:var(--ink-2)}
.tl .navsec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:14px 9px 4px;font-weight:650}
.tl .sw{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.tl .health{margin-top:auto;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:12px;color:var(--ink-2);display:grid;gap:4px;text-align:left;background:none;width:100%}
.tl .health:hover{background:var(--panel-2)}
.tl main{display:flex;flex-direction:column;min-width:0}
.tl header{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.tl .crumbs{color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .crumbs b{color:var(--ink);font-weight:600}
.tl header .btn.primary{margin-left:auto}
.tl .search{display:flex;align-items:center;gap:8px;border:1px solid var(--ctl);background:var(--panel-2);border-radius:8px;padding:5px 10px;width:300px;color:var(--ink-3);text-align:left}
.tl kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--ctl);border-radius:4px;padding:0 4px;color:var(--ink-3);background:var(--panel)}
.tl .iconbtn{border:1px solid var(--ctl);background:var(--panel);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;flex:none}
.tl .iconbtn svg{width:16px;height:16px}
.tl .view{padding:18px 20px 28px;flex:1;min-width:0;outline:none}
@media (max-width:1180px){
  .tl .shell{grid-template-columns:60px minmax(0,1fr)}
  .tl nav .nl,.tl nav .navsec,.tl nav .projlink,.tl .logo span,.tl .health .hx{display:none}
  .tl .navbtn{justify-content:center;position:relative}
  .tl .navbtn .badge{position:absolute;top:0;right:2px;margin:0}
  .tl .health{place-items:center}
  .tl .grid2{grid-template-columns:minmax(0,1fr) 270px}
  .tl .search{width:220px}
}

/* ---------- project scope switcher ---------- */
.tl .scopewrap{position:relative;margin:0 0 10px}
.tl .scopebtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--ctl);background:var(--panel);border-radius:8px;padding:6px 9px;text-align:left;min-height:36px}
.tl .scopebtn:hover{background:var(--panel-2)}
.tl .scopebtn .lbl2{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650;display:block;line-height:1.1}
.tl .scopebtn .nm{font-weight:650;display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .scopemenu{position:absolute;left:0;top:calc(100% + 4px);width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:15}
.tl .scopemenu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;border-radius:7px;padding:7px 9px;text-align:left;min-height:34px}
.tl .scopemenu button:hover,.tl .scopemenu button[aria-checked=true]{background:var(--brand-soft)}
.tl .scopemenu .hint{font-size:12px;color:var(--ink-3);padding:6px 9px 2px;border-top:1px solid var(--line);margin-top:4px}
.tl .scopebar{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.tl .gnode.ext rect.b{fill:var(--panel-2);stroke-dasharray:4 3}
@media (max-width:1180px){.tl .scopebtn .txt,.tl .scopebtn .chev{display:none}.tl .scopebtn{justify-content:center;padding:6px}}

/* ---------- structure tree & labels ---------- */
.tl .label{display:inline-flex;align-items:center;font-size:11.5px;border:1px solid var(--ctl);border-radius:4px;padding:0 5px;color:var(--ink-2);line-height:17px}
.tl .label::before{content:"#";color:var(--ink-3);margin-right:1px}
.tl .ptag{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- chips, status, priority ---------- */
.tl .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;font-weight:550;line-height:18px}
.tl .st-inbox{background:var(--gray-soft);color:var(--ink-2)}
.tl .st-planning{background:var(--teal-soft);color:var(--teal)}
.tl .st-ready{background:var(--info-soft);color:var(--info)}
.tl .st-progress{background:var(--violet-soft);color:var(--violet)}
.tl .st-review{background:var(--warn-soft);color:var(--warn)}
.tl .st-done{background:var(--ok-soft);color:var(--ok)}
.tl .st-canceled{background:var(--gray-soft);color:var(--ink-3);text-decoration:line-through}
.tl .c-bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.tl .c-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.tl .c-info{background:var(--info-soft);color:var(--info)}
.tl .c-gray{background:var(--gray-soft);color:var(--ink-2)}
.tl .c-ok{background:var(--ok-soft);color:var(--ok)}
.tl .type{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tl .tsq{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;color:var(--t-fg);flex:none}
.tl .tsq svg{width:11px;height:11px}
.tl .t-epic .tsq{background:var(--t-epic)} .tl .t-story .tsq{background:var(--t-story)} .tl .t-task .tsq{background:var(--t-task)} .tl .t-bug .tsq{background:var(--t-bug)}
.tl .type.iconly{gap:0}
.tl .prio{display:inline-flex;align-items:center;gap:3px;font:600 11.5px var(--mono);color:var(--ink-2)}
.tl .prio svg{width:12px;height:12px}

/* ---------- run state: icon shape + text, never colour alone ---------- */
.tl .run{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.tl .ri{width:12px;height:12px;border-radius:50%;display:inline-grid;place-items:center;font:800 9px/1 var(--sans);font-style:normal;flex:none}
.tl .ri-live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent);animation:tlpulse 2s infinite}
.tl .ri-reported{border:2px solid var(--violet)}
.tl .ri-stale{border:1.5px dashed var(--ink-3)}
.tl .ri-needs{background:var(--warn);color:var(--on-fill)}
.tl .ri-failed{background:var(--bad);color:var(--on-fill)}
.tl .ri-finished{background:var(--gray-soft);color:var(--ink-2);border:1px solid var(--ctl)}
.tl .ri-interrupted{border:1.5px solid var(--ink-3);color:var(--ink-3)}
.tl .run-failed>span{color:var(--bad);font-weight:600}
.tl .run-needs>span{color:var(--warn);font-weight:600}
.tl .run-stale>span{color:var(--ink-3);font-style:italic}
@keyframes tlpulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.tl .ri-live{animation:none}.tl *{transition:none!important}}

/* ---------- provenance badges: each kind has its own border style + icon ---------- */
.tl .prov{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:6px;padding:1px 7px;font-weight:600;white-space:nowrap;line-height:17px}
.tl .prov svg{width:12px;height:12px;flex:none}
.tl .pv-owner{background:var(--ok);color:var(--on-fill)}
.tl .pv-owner.pv-owner-ch{background:var(--warn)}
.tl .pv-owner.pv-owner-def{background:var(--info)}
.tl .pv-agent{border:1.5px dashed var(--violet);color:var(--violet)}
.tl .pv-observed{border:1.5px solid var(--violet);color:var(--violet);background:var(--violet-soft)}
.tl .pv-relayed{border:1.5px dotted var(--ink-3);color:var(--ink-2)}
.tl .pv-auto{background:var(--info-soft);color:var(--info)}
.tl .pv-git{background:var(--gray-soft);color:var(--ink-2)}
.tl .pv-pending{border:1.5px solid var(--warn);color:var(--warn);background:var(--warn-soft)}

/* ---------- buttons & form controls ---------- */
.tl .btn{border:1px solid var(--ctl);background:var(--panel);border-radius:8px;min-height:30px;padding:4px 12px;font-weight:550;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tl .btn svg{width:14px;height:14px}
.tl .btn:hover{background:var(--panel-2)}
.tl .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-fill)}
.tl .btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-fill)}
.tl .btn.sm{min-height:28px;padding:2px 10px;font-size:12.5px}
.tl .btn:disabled{opacity:.55;cursor:not-allowed}
.tl .btn.ghost{border-color:transparent;background:none;color:var(--brand)}
.tl .seg{display:inline-flex;border:1px solid var(--ctl);border-radius:8px;overflow:hidden}
.tl .seg button{border:0;background:var(--panel);min-height:28px;padding:3px 11px;border-right:1px solid var(--ctl)}
.tl .seg button:last-child{border-right:0}
.tl .seg button[aria-pressed=true]{background:var(--brand-soft);color:var(--brand);font-weight:650}
.tl .fchip{border:1px solid var(--ctl);border-radius:999px;min-height:28px;padding:2px 11px;background:var(--panel);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.tl .fchip b{font-weight:700}
.tl .fchip[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tl textarea,.tl .input,.tl select{width:100%;border:1px solid var(--ctl);border-radius:8px;padding:7px 9px;background:var(--panel);color:var(--ink)}
.tl textarea{min-height:72px;resize:vertical}
.tl select{width:auto;padding:3px 8px;min-height:28px}
.tl span.f{display:block;font-size:12px;color:var(--ink-3);margin:0 0 4px}
.tl label.f{display:block;font-size:12px;color:var(--ink-3);margin:10px 0 4px}

/* ---------- needs you ---------- */
.tl .filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tl .att{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.tl .att:first-child{border-top:0}
.tl .att:hover{background:var(--panel-2)}
.tl .att.decision{background:color-mix(in srgb,var(--warn-soft) 55%,transparent)}
.tl .att.decision:hover{background:var(--warn-soft)}
.tl .att .why{color:var(--ink-2);margin-top:2px}
.tl .att .t{font-weight:600}
.tl .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.tl .ico svg{width:15px;height:15px}
.tl .reply{margin-top:8px;display:grid;gap:6px;cursor:default}
.tl .agent-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:9px 14px;border-top:1px solid var(--line)}
.tl .agent-row:first-of-type{border-top:0}
.tl .agent-row>.btn{align-self:start}
.tl .chg{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:6px 14px;font-size:12.5px;border-top:1px solid var(--line)}
.tl .chg:first-of-type{border-top:0}
.tl .sectionhead{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 7px}
.tl .sectionhead h3{margin:0}

/* ---------- work ---------- */
.tl .board{display:grid;grid-template-columns:repeat(6,minmax(176px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.tl .col{background:var(--panel-2);border-radius:10px;padding:8px;min-height:440px}
.tl .colh{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;font-weight:650;font-size:12.5px;color:var(--ink-2)}
.tl .subh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2);padding:8px 4px 6px;border-top:1px dashed var(--ctl);margin-top:4px}
.tl a.tcard{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;color:var(--ink);text-decoration:none}
.tl a.tcard:hover{border-color:var(--brand);text-decoration:none}
.tl a.tcard.isblocked{border-left:3px solid var(--bad)}
.tl a.tcard.owed{border-left:3px solid var(--warn)}
.tl .tcard .t{font-weight:600;line-height:1.3}
.tl .tcw{position:relative}
.tl .tcw .archbtn{position:absolute;right:8px;bottom:8px;padding:2px 8px;min-height:24px;font-size:12px}
.tl .tcw .tcard{padding-bottom:36px}
.tl .tcard.archived{opacity:.7}
.tl .tcard .mono,.tl .type{white-space:nowrap}
.tl .tcard .prov,.tl .tcard .chip{white-space:normal;line-height:16px;padding-top:1px;padding-bottom:1px}
.tl .tcard .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.tl .mini{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px 6px}
.tl table{width:100%;border-collapse:collapse}
.tl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line)}
.tl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tl tbody tr:hover{background:var(--panel-2)}
.tl tr.clickrow{cursor:pointer}

/* ---------- ticket ---------- */
.tl .tk-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.tl .banner{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.tl .banner>svg{width:18px;height:18px;flex:none;color:var(--warn)}
.tl .banner.q{align-items:flex-start}
.tl .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tl .tabs button{border:0;background:none;padding:7px 10px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:32px}
.tl .tabs button[aria-selected=true]{color:var(--ink);border-color:var(--brand);font-weight:650}
.tl .tabdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}
.tl .tabdot.bad{background:var(--bad)}
.tl .step{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.tl .step:first-child{border-top:0}
.tl .sicon{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;margin-top:1px;flex:none}
.tl .s-done{background:var(--ok);color:var(--on-fill)}
.tl .s-current{border:2px solid var(--violet)}
.tl .s-current::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--violet)}
.tl .s-planned{border:1.5px dashed var(--ctl)}
.tl .s-blocked{background:var(--bad);color:var(--on-fill)}
.tl .s-skipped{background:var(--gray-soft);color:var(--ink-3);border:1px solid var(--ctl)}
.tl .step .title{font-weight:600}
.tl .step s{color:var(--ink-3);font-weight:400}
.tl .contrib{margin-top:6px;border-left:2px solid var(--line-2);padding:4px 0 4px 10px;font-size:12.5px;color:var(--ink-2);display:grid;gap:3px}
.tl .changed{font-size:12px;color:var(--warn);margin-top:3px}
.tl .ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.tl .ev:first-child{border-top:0}
.tl .ev .d{font-size:12px;color:var(--ink-3);grid-column:1/-1}
.tl .kv{display:grid;grid-template-columns:96px 1fr;gap:7px 8px;font-size:12.5px;margin:0}
.tl .kv dt{color:var(--ink-3)} .tl .kv dd{margin:0}
.tl .lrow{display:flex;align-items:center;gap:7px;padding:4px 0;min-height:28px}
.tl .act{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:6px 0;font-size:12.5px;border-top:1px dashed var(--line)}
.tl .act:first-child{border-top:0}
.tl .err{font:12px var(--mono);background:var(--bad-soft);color:var(--bad);padding:8px 10px;border-radius:7px;white-space:pre-wrap;margin:6px 0}
.tl .callout{font-size:12.5px;border-radius:8px;padding:8px 10px;background:var(--info-soft);color:var(--info)}
.tl .callout.warn{background:var(--warn-soft);color:var(--warn)}
.tl .callout.bad{background:var(--bad-soft);color:var(--bad)}
.tl .callout.ok{background:var(--ok-soft);color:var(--ok)}

/* ---------- graph ---------- */
.tl svg text{font-family:var(--sans)}
.tl .gnode{cursor:pointer;outline:none}
.tl .gnode rect.b{fill:var(--panel);stroke:var(--ctl);stroke-width:1.2}
.tl .gnode:focus-visible rect.b{stroke:var(--brand);stroke-width:3}
.tl .gnode.sel rect.b{stroke:var(--brand);stroke-width:2.5}
.tl .gnode.chain rect.b{stroke:var(--bad);stroke-width:2}
.tl .gnode.unblock rect.b{stroke:var(--ok);stroke-width:2;stroke-dasharray:5 3}
.tl .gnode.done rect.b{fill:var(--ok-soft)}
.tl .gnode.cyc rect.b{fill:var(--bad-soft);stroke:var(--bad)}
.tl .edge{stroke:var(--ink-3);stroke-width:1.4;fill:none}
.tl .edge.hot{stroke:var(--bad);stroke-width:2.6}
.tl .edge.rel{stroke-dasharray:3 4;stroke:var(--ctl)}
.tl .edge.cyc{stroke:var(--bad);stroke-dasharray:6 3}
.tl .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.tl .legend span{display:inline-flex;gap:6px;align-items:center}

/* ---------- timeline ---------- */
.tl .tl-row{display:grid;grid-template-columns:240px 1fr;border-top:1px solid var(--line);align-items:stretch}
.tl .tl-row .lbl{padding:6px 10px;display:flex;gap:6px;align-items:center;min-width:0}
.tl .tl-row .lbl a{white-space:nowrap}
.tl .tl-row .lbl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .track{position:relative;height:52px;border-left:1px solid var(--line)}
.tl .bar{position:absolute;top:7px;height:16px;border-radius:4px;font-size:11px;padding:0 6px;white-space:nowrap;display:flex;align-items:center;gap:4px;z-index:2}
.tl .bar.planned{background:color-mix(in srgb,var(--brand) 18%,var(--panel));border:1.5px solid var(--brand);color:var(--brand);font-weight:600}
.tl .bar.planned.risk{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.tl .bar.planned.done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.tl .bar.actual{top:25px;height:5px;background:var(--violet);padding:0;border-radius:3px}
.tl .bar.forecast{background:repeating-linear-gradient(45deg,transparent 0 4px,color-mix(in srgb,var(--ink-3) 35%,transparent) 4px 6px);border:1.5px dashed var(--ink-3);color:var(--ink);font-weight:600}
.tl .setby{position:absolute;top:32px;font-size:11.5px;color:var(--ink-3);white-space:nowrap;background:var(--panel);padding:0 3px;z-index:3;border-radius:3px}
.tl .today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--bad);z-index:1}
.tl .dep{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink-3);z-index:1}
.tl .dep.risk{border-color:var(--bad)}
.tl .dep span{position:absolute;left:4px;top:34px;font-size:11px;white-space:nowrap;color:var(--ink-3);background:var(--panel);padding:0 2px;z-index:3}
.tl .dep.risk span{color:var(--bad);font-weight:650}
.tl .weeks{display:grid;grid-template-columns:240px 1fr}
.tl .weeks .w{position:relative;height:28px;border-left:1px solid var(--line)}
.tl .weeks .w span{position:absolute;font-size:12px;color:var(--ink-3);top:6px;left:6px}

/* ---------- reviews ---------- */
.tl .rv{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:1180px){.tl .rv{grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto 1fr}.tl .rv>.rvq{grid-column:1;grid-row:1}.tl .rv>.packet{grid-column:2;grid-row:1 / span 2}.tl .rv>.stack{grid-column:1;grid-row:2}}
.tl .rvq button{display:grid;gap:3px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 12px}
.tl .rvq button[aria-current=true]{background:var(--brand-soft)}
.tl .doc{padding:20px 26px;font-size:13.5px;line-height:1.65}
.tl .doc h1{font-size:20px;margin-bottom:8px}
.tl .doc h2{font-size:15px;margin:16px 0 6px}
.tl .doc code{font-family:var(--mono);font-size:12px;background:var(--panel-2);padding:1px 4px;border-radius:4px}
.tl .doc ins{background:var(--ok-soft);text-decoration:none;border-bottom:1.5px solid var(--ok)}
.tl .doc del{background:var(--bad-soft);color:var(--ink-2)}
.tl .doc.plain ins{background:none;border:0}
.tl .doc.plain del{display:none}
.tl .vers{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tl .vbtn{border:1px solid var(--ctl);background:var(--panel);border-radius:7px;min-height:28px;padding:2px 9px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.tl .vbtn[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:650}
.tl .dec{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tl .dec button{border:1px solid var(--ctl);background:var(--panel);border-radius:8px;min-height:34px;padding:5px;font-weight:600;white-space:nowrap;font-size:12.5px;display:flex;gap:6px;align-items:center;justify-content:center}
.tl .dec button svg{width:14px;height:14px}
.tl .dec button[aria-checked=true]{outline:2px solid var(--brand);outline-offset:1px;background:var(--brand-soft)}
.tl .check{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.tl .check input{width:16px;height:16px;margin-top:2px;accent-color:var(--ok)}

/* ---------- connections / projects ---------- */
.tl pre.code{font:12px/1.5 var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0 0;overflow:auto;white-space:pre}
.tl .proj-card{display:grid;grid-template-columns:minmax(0,1fr) 230px 150px auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.tl .proj-card:first-of-type{border-top:0}
.tl .bar-mini{height:7px;border-radius:4px;background:var(--panel-2);display:flex;overflow:hidden;border:1px solid var(--line)}
.tl .bar-mini i{display:block;height:100%}

/* ---------- overlays ---------- */
.tl .toast{position:absolute;right:24px;bottom:24px;background:var(--ink);color:var(--panel);padding:9px 12px 9px 14px;border-radius:9px;font-size:12.5px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;display:flex;gap:12px;align-items:center;z-index:30;max-width:460px}
.tl .toast.on{opacity:1;transform:none;pointer-events:auto}
.tl .toast button{background:none;border:1px solid color-mix(in srgb,var(--panel) 50%,transparent);color:var(--panel);border-radius:6px;padding:2px 8px;font-weight:650}
.tl .ov{position:absolute;inset:0;background:rgba(10,12,16,.38);display:flex;align-items:flex-start;justify-content:center;padding-top:80px;z-index:20;border-radius:12px}
.tl .dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(640px,94%);max-height:640px;overflow:auto}
.tl .dlg header{border-radius:12px 12px 0 0;justify-content:space-between}
.tl .dlg .body{padding:14px 16px}
.tl .dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.tl .pal input{border:0;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;padding:14px 16px;font-size:15px;outline:none;width:100%;background:var(--panel);color:var(--ink)}
.tl .pal .res{max-height:380px;overflow:auto;padding:6px}
.tl .pal .res button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px}
.tl .pal .res button:hover,.tl .pal .res button.hi{background:var(--brand-soft)}
.tl .pal .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:8px 10px 4px;font-weight:650}
.tl .hv{display:grid;gap:10px}
.tl .hv .ver{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.tl .hv .add{color:var(--ok)} .tl .hv .rm{color:var(--bad);text-decoration:line-through}
/* ---------- open-item tabs ---------- */
.tl .tabstrip{display:flex;gap:4px;align-items:flex-end;padding:6px 18px 0;background:var(--panel-2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;min-height:40px;min-width:0;scrollbar-width:thin;contain:inline-size}
.tl .otab{flex:0 0 200px;width:200px;min-width:0}
.tl .otab .og{flex:1}
.tl .tabstrip:empty{display:none}
.tl .otab{display:inline-flex;align-items:center;gap:2px;max-width:230px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--panel-2);margin-bottom:-1px}
.tl .otab[aria-selected=true]{background:var(--bg);border-color:var(--line-2);box-shadow:inset 0 2px 0 var(--brand)}
.tl .otab .og{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 4px 6px 10px;min-width:0;font-size:12.5px;color:var(--ink-2)}
.tl .otab[aria-selected=true] .og{color:var(--ink);font-weight:600}
.tl .otab .og .tt2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .otab .ox{border:0;background:none;color:var(--ink-3);width:24px;height:24px;border-radius:6px;display:grid;place-items:center;margin-right:3px}
.tl .otab .ox:hover{background:var(--line);color:var(--ink)}
.tl .tabhint{font-size:11.5px;color:var(--ink-3);margin-left:auto;padding:0 2px 8px;white-space:nowrap}
/* ---------- single-column detail pages with collapsible sections ---------- */
.tl .stack1{display:grid;gap:12px;min-width:0}
.tl .stack1>*{min-width:0}
.tl .sec{padding:0}
.tl .sechead{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px}
.tl .sectog{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 6px;border-radius:7px;flex:1;min-width:0;text-align:left}
.tl .sectog:hover{background:var(--panel-2)}
.tl .sectog h3,.tl .sectog h2{margin:0}
.tl .sectog .src{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl .sectog .chev{display:inline-grid;transition:transform .12s;color:var(--ink-3)}
.tl .sec.collapsed .sectog .chev{transform:rotate(-90deg)}
.tl .secbody{padding:0 14px 14px 36px}
.tl .sec.collapsed{background:var(--panel-2)}

/* ---------- checklist card ---------- */
.tl .clcard h2{font-size:15px}
.tl .clcard .ckgroup{margin-top:18px}
.tl .clcard .ckgroup:first-of-type{margin-top:10px}
.tl .addrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.tl .addrow .input{padding:5px 9px;min-height:30px}
.tl .clrm{border:0;background:none;color:var(--bad);font-size:12px;padding:0 4px;min-height:22px}
.tl .grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1180px){.tl .grid2e{grid-template-columns:minmax(0,1fr)}}

/* ---------- editable human review ---------- */
.tl .hrby{font-size:11.5px;color:var(--ink-3)}
.tl .hrtools{display:inline-flex;gap:2px;margin-left:4px}
.tl .hrtools button{border:0;background:none;color:var(--brand);font-size:12px;padding:0 4px;min-height:22px}
.tl .hrtools button.rm{color:var(--bad)}
.tl .hradd{display:grid;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2)}
.tl .hradd textarea,.tl .hredit textarea{min-height:52px}

/* ---------- epics row on Work ---------- */
.tl .epicrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:12px}
.tl .epiccard{display:grid;gap:6px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--t-epic);background:var(--panel);border-radius:9px;padding:9px 11px}
.tl .epiccard:hover{border-color:var(--brand);border-left-color:var(--t-epic)}
.tl .epiccard[aria-current=true]{box-shadow:0 0 0 2px var(--brand)}
.tl .epiccard .et{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl a.epiclink{color:var(--ink);font-weight:600}
.tl a.epiclink .ed{color:var(--t-epic)}

/* ---------- progress map ---------- */
.tl .ptools{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-bottom:8px}
.tl .ptools .phint{display:none;margin-right:auto}
.tl .pmapbox.pannable .ptools .phint{display:inline}
.tl .ptools .seg button{min-width:34px}
.tl .pframe{position:relative}
.tl .pcanvas{position:relative;overflow:auto;max-height:540px;border:1px solid var(--line);border-radius:10px;padding:18px 22px;cursor:grab;
  background-color:var(--panel-2);background-image:radial-gradient(var(--line-2) 1px,transparent 1.2px);background-size:18px 18px}
.tl .pcanvas.dragging{cursor:grabbing;user-select:none}
.tl .pcanvas:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tl .psizer{position:relative}
.tl .pmap{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;grid-auto-flow:column;grid-auto-columns:200px;column-gap:76px;align-items:start}
.tl .pcol{display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.tl .pframe::before,.tl .pframe::after{content:"";position:absolute;top:1px;bottom:1px;width:44px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:3}
.tl .pframe::before{left:1px;border-radius:10px 0 0 10px;background:linear-gradient(90deg,var(--panel-2) 15%,transparent)}
.tl .pframe::after{right:1px;border-radius:0 10px 10px 0;background:linear-gradient(270deg,var(--panel-2) 15%,transparent)}
.tl .pframe.more-l::before,.tl .pframe.more-r::after{opacity:1}
.tl .pmore{position:absolute;top:12px;z-index:4;display:none;border:1px solid var(--ctl);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tl .pmore.r{right:10px} .tl .pmore.l{left:10px}
.tl .pframe.more-r .pmore.r,.tl .pframe.more-l .pmore.l{display:block}
.tl .pmore.b{top:auto;bottom:8px;left:50%;transform:translateX(-50%)}
.tl .pframe.more-b .pmore.b{display:block}
.tl .pcolh{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;line-height:1.3;min-height:28px}
.tl .pcolh span{display:block;text-transform:none;letter-spacing:0;font-weight:500}
.tl a.pnode{display:block;position:relative;border:1px solid var(--line);border-left:4px solid var(--sc,var(--ctl));background:var(--panel);border-radius:8px;padding:6px 8px 6px 9px;color:var(--ink);text-decoration:none;font-size:12.5px;width:100%}
.tl a.pnode:hover{text-decoration:none;border-color:var(--brand);border-left-color:var(--sc,var(--ctl))}
.tl .pnode .pt{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0}
.tl .pnode .ps{font-size:11.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tl .pnode.ps-done{--sc:var(--ok);background:var(--ok-soft)}
.tl .pnode.ps-review{--sc:var(--warn)}
.tl .pnode.ps-progress{--sc:var(--violet)}
.tl .pnode.ps-ready{--sc:var(--info)}
.tl .pnode.ps-planning{--sc:var(--teal)}
.tl .pnode.ps-inbox{--sc:var(--ctl)}
.tl .pnode.blk{box-shadow:inset 0 0 0 1px var(--bad)}
.tl .pnode.ext{border-style:dashed;background:var(--panel-2)}
.tl .pnode.cur{outline:2px solid var(--brand);outline-offset:1px}
.tl .pnode.hl{outline:2px solid var(--brand);outline-offset:1px}
.tl .pnode .done-mark{position:absolute;top:5px;right:6px;color:var(--ok);font-weight:800}
.tl .pnode .hrmark{position:absolute;top:5px;right:6px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.tl .pnode .hrmark svg{width:11px;height:11px}
.tl .pnode .hrmark.now{background:var(--warn);color:var(--on-fill)}
.tl .pnode .hrmark.later{border:1.5px solid var(--warn);color:var(--warn);background:var(--panel)}
.tl .hrkey{display:inline-flex;gap:5px;align-items:center}
.tl .hrkey .hrmark{position:static;width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center}
.tl .hrkey .hrmark svg{width:10px;height:10px}
.tl .hrkey .hrmark.now{background:var(--warn);color:var(--on-fill)}
.tl .hrkey .hrmark.later{border:1.5px solid var(--warn);color:var(--warn)}
.tl .epicstrip{display:flex;gap:10px;align-items:center;border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.tl .epicstrip.later{border-style:dashed;background:var(--panel)}
.tl svg.pedges{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.tl .pe{fill:none;stroke:var(--ink-3);stroke-width:1.5;opacity:.7}
.tl .pe.ok{stroke:var(--ok);opacity:.45;stroke-dasharray:4 3}
.tl .pe.hl{stroke:var(--brand);stroke-width:2.5;opacity:1}
.tl .phead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center;margin-bottom:12px}
.tl .phead .big{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tl .pbar{height:10px;border-radius:5px;display:flex;overflow:hidden;background:var(--panel-2);border:1px solid var(--line)}
.tl .pbar i{display:block;height:100%}
.tl .plegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);grid-column:2}
.tl .plegend span{display:inline-flex;gap:5px;align-items:center}
.tl .plegend b{width:9px;height:9px;border-radius:2px;display:inline-block}
.tl .hop{display:grid;gap:6px}
.tl .hop .arrow{text-align:center;color:var(--ink-3);font-size:12px;line-height:1}

/* ---------- Needs you dashboard ---------- */
.tl .pulse{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:7px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:12px;font-size:12.5px}
.tl .dash-top{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:12px;margin-bottom:12px;align-items:start}

.tl .mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}

.tl .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl .ico.sm{width:24px;height:24px;border-radius:7px}
.tl .ico.sm svg{width:13px;height:13px}
.tl .att.compact{padding:10px 14px;align-items:center}
.tl .att.compact .why{margin-top:1px}
.tl .cardfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}

/* ---------- checklist & handoff packet ---------- */
.tl .ck{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.tl .ckgroup{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.tl .ckgroup:first-child{margin-top:0}
.tl .ckgroup + .ck{border-top:0}
.tl .packet section{padding:14px 0 4px;border-top:1px solid var(--line)}
.tl .packet section:first-child{border-top:0}
.tl .packet h2{font-size:14px;margin:0 0 8px}
.tl .hrcard .ck{grid-template-columns:22px minmax(0,1fr)}
.tl .hrcard .ck > div:last-child{grid-column:2;justify-self:start;margin-top:-2px}
.tl .hritem{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:8px}
.tl .verdict{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tl .verdict .ap[aria-pressed=true]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tl .verdict .ch[aria-pressed=true]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tl .verdict .df[aria-pressed=true]{background:var(--info-soft);border-color:var(--info);color:var(--info)}
.tl .attach{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ctl);background:var(--panel);border-radius:8px;padding:5px 9px;margin:0 6px 6px 0;font-size:12.5px}
.tl .attach:hover,.tl .docrow:hover{border-color:var(--brand);background:var(--panel-2)}
.tl .docrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:7px;padding:6px 8px;margin:0 -8px}
.tl .docview{border:1px solid var(--line);border-radius:9px;padding:14px 18px;background:var(--panel);line-height:1.6}
.tl .docview h1{font-size:18px;margin:0 0 6px}.tl .docview h2{font-size:14px;margin:14px 0 4px}
.tl .media{display:grid;place-items:center;height:180px;border:1px dashed var(--ctl);border-radius:9px;color:var(--ink-3);background:var(--panel-2)}
.tl a.label{text-decoration:none}
.tl .agent-row .mono,.tl .lrow .mono{white-space:nowrap}
.tl a.label:hover{border-color:var(--brand);color:var(--brand)}

   Derived state — the same rules the MCP queries would use
   ===================================================================== */
const isEpic = i => i.type === 'Epic';
const isOpen = i => i.status !== 'done' && i.status !== 'canceled';
const inScope = i => S.scope === 'all' || i.proj === S.scope;
const unresolved = i => (i.blockedBy || []).filter(b => byId[b] && byId[b].status !== 'done');
const isBlocked = i => isOpen(i) && unresolved(i).length > 0;
const dependents = id => items.filter(i => (i.blockedBy || []).includes(id));
const holdsUp = id => dependents(id).filter(isOpen).map(i => i.id);
const freedBy = id => dependents(id).filter(i => isOpen(i) && unresolved(i).every(b => b === id)).map(i => i.id);
function cycleSet(){
  const s = new Set();
  for (const i of items){
    const seen = new Set(), st = [...(i.blockedBy || [])];
    while (st.length){ const x = st.pop(); if (x === i.id){ s.add(i.id); break; } if (seen.has(x) || !byId[x]) continue; seen.add(x); st.push(...(byId[x].blockedBy || [])); }
  }
  return s;
}
const dateRisks = i => (i.start && isOpen(i)) ? unresolved(i).filter(b => byId[b].end && D(byId[b].end) >= D(i.start)) : [];
const hrOf = i => i.hr || [];
const packetReady = i => i.status === 'review' && hrOf(i).some(h => h.state === 'ready');
const hrComing = i => isOpen(i) && !packetReady(i) && hrOf(i).some(h => h.state === 'declared');
const questionOpen = i => !!(i.question && !i.question.answer);
const pkStale = i => { const c = curPacket(i.id); return packetReady(i) && !!c && !!c.commit && !!i.head && i.head !== c.commit; };
const deferredList = () => items.filter(inScope).flatMap(i => hrOf(i).map((h, n) => ({i, h, n}))).filter(x => x.h.state === 'deferred');
const forYou = i => packetReady(i) || questionOpen(i);
const forYouIn = key => items.filter(i => (key === 'all' || i.proj === key) && forYou(i));
const childrenOf = id => items.filter(x => x.epic === id);
const curPacket = id => PACKETS[id] && PACKETS[id].rounds[PACKETS[id].rounds.length - 1];
const workOf = id => (DETAIL[id] && DETAIL[id].work) || [];
const nextId = key => key + '-' + (Math.max(...items.filter(i => i.proj === key).map(i => +i.id.split('-')[1])) + 1);

function problems(){
  const q = [], cyc = cycleSet();
  for (const i of items.filter(inScope)){
    if (i.run === 'stale') q.push({id:i.id, icon:'stale', why:`Lead run silent for ${i.age}; the lease expires in 13 min. Treated as unknown, not finished. Another agent's claim was rejected at 10:58.`, action:'Inspect', a:'inspect', v:i.id});
    if (i.run === 'failed') q.push({id:i.id, icon:'failed', why:'Run failed: outbound network is blocked in this worker sandbox. Nothing retries automatically.', action:'Inspect', a:'inspect', v:i.id});
    const dr = dateRisks(i);
    if (dr.length) q.push({id:i.id, icon:'date', why:`Planned start ${fmt(D(i.start))} is before its blocker ${dr[0]} is planned to finish (${fmt(D(byId[dr[0]].end))}).`, action:'Timeline', a:'nav', v:'timeline'});
  }
  const cids = [...cyc].filter(id => inScope(byId[id])).sort();
  if (cids.length) q.push({id:cids[0], icon:'cycle', why:`Dependency cycle in imported data: ${cids.join(' ⇄ ')}. Neither can start until one link is removed.`, action:'Fix', a:'gfix', v:cids[0]});
  q.forEach(r => r.holds = holdsUp(r.id));
  return q.sort((a,b) => b.holds.length - a.holds.length);
}

function progressMap(list, opts={}){
  const set = new Set(list.map(i => i.id)), cyc = cycleSet(), depth = {};

  const byStatus = Object.keys(STATUS).map(s => [s, kids.filter(k => k.status===s && (S.showArch || !k.arch))]).filter(([,l]) => l.length);
  const tab = ({deps:'map'})[S.epicTab] || S.epicTab || 'details', activity = [...(S.extraActivity[i.id] || []), ...d.activity];
  const hrs = hrOf(i), hrNow = packetReady(i);

  const strip = hrs.length ? `<div class="epicstrip ${hrNow ? '' : 'later'}"><span class="hrkey"><span class="hrmark ${hrNow ? 'now' : 'later'}">${I.person}</span></span>
      <div class="grow"><b>Epic-level human review${hrNow ? ': packet ready' : ''}</b> · ${hrs.map(h => esc(h.t)).join(' · ')} <span class="src">${hrNow ? '' : 'Reviewed once, when the epic is ready to merge.'}</span></div>
      ${hrNow ? `<button class="btn primary sm" data-a="packet" data-v="${i.id}">Open packet</button>` : `<span class="chip c-gray">Coming up</span>`}</div>` : '';
  const body = tab === 'map'
    ? `${strip}<div class="card pad">${progressMap(kids, {empty:'No items yet. When planned, the agent breaks this epic into stories, tasks and bugs.'})}</div>`
    : tab === 'checklist' ? `<div class="stack1">${checklistCard(i, d)}</div>`
    : tab === 'details'
    ? `<div class="stack1">

          ${d.docs.length ? `<h3 style="margin-top:14px">Documents</h3>${d.docs.map(x => docRow(x, i.id)).join('')}` : ''}`)}
        ${sec('tickets', 'Tickets in this epic', `${done}/${kids.length} done · ${kids.filter(k => isBlocked(k) && k.status === 'ready').length} ready but blocked · ${kids.filter(forYou).length} for you`, `${byStatus.map(([s, l]) => `<div class="src" style="margin-top:8px">${STATUS[s]} · ${l.length}</div>${l.map(k => `<div class="lrow">${typeIcon(k)}${link(k.id)}<span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k.title)}</span>${hrChip(k)}${blockedChip(k)}${k.arch ? '<span class="chip c-gray">Archived</span>' : ''}</div>`).join('')}`).join('') || '<div class="muted">No items yet.</div>'}
          ${archN ? `<div class="src" style="margin-top:8px">${S.showArch ? '' : `+ ${archN} archived · `}<a href="#" data-a="togglearch">${S.showArch ? 'Hide archived' : 'Show'}</a></div>` : ''}`)}
      </div>`
    : `<div class="card pad">${notePanel(i, 'agents')}

  return `<div class="tk-head"><div class="grow">
      <div class="row wrap"><span class="mono muted">${i.id}</span>${typeBadge(i)}${labelsOf(i)}</div>
      <h1 style="margin-top:4px">${esc(i.title)}</h1>
      <div class="row wrap" style="margin-top:6px">${statusChip(i)}<span class="src">${P[i.proj].name} · ${kids.length} item${kids.length===1?'':'s'} · ${done} done</span>

        ${i.status==='planning' ? `<button class="btn sm primary" data-a="promote" data-v="${i.id}">${I.promote} Move to Ready</button><span class="src">This epic is still a brief. Move it once you've broken it down.</span>` : ''}</div></div></div>
    ${viewTabs(i, tabs, tab)}
    <div role="tabpanel" id="epanel" aria-labelledby="etab-${tab}">${body}</div>`;
}

/* ---------- Human review (handoff packets) ---------- */
V.review = () => {
  const sc = items.filter(inScope), ready = sc.filter(packetReady), coming = sc.filter(hrComing);
  const decided = sc.filter(i => PACKETS[i.id] && !packetReady(i) && PACKETS[i.id].rounds.some(r => r.decided));
  if (!ready.length && !decided.length) return `<h1>Human review</h1><div class="sub">Nothing to verify right now. <a href="#" data-a="nav" data-v="attention">Back to Needs you</a></div>`;
  if (!PACKETS[S.pk] || !inScope(byId[S.pk])) S.pk = (ready[0] || decided[0]).id;
  const i = byId[S.pk], pk = PACKETS[i.id], latest = pk.rounds[pk.rounds.length - 1];
  const r = pk.rounds.find(x => x.n === S.pkRound) || latest, live = r === latest && packetReady(i);
  const v = S.verdicts[i.id] || {};
  const qbtn = x => `<button data-a="packet" data-v="${x.id}" aria-current="${S.pk===x.id}"><span class="row"><span class="mono">${x.id}</span>${packetReady(x) ? `<span class="chip c-warn">Round ${curPacket(x.id).n}</span>` : `<span class="chip ${x.status==='done' ? 'c-ok' : 'c-gray'}">${x.status==='done' ? 'Approved' : 'Sent back'}</span>`}</span><span style="font-weight:600">${esc(x.title)}</span><span class="src">${packetReady(x) ? `about ${curPacket(x.id).est}` : ''}${pkStale(x) ? ' · <b style="color:var(--bad)">out of date</b>' : ''}</span></button>`;
  const itemsHtml = (live ? hrOf(i).filter(h => h.state === 'ready').map(h => h.t) : r.items || hrOf(i).map(h => h.t)).map((t, n) => {
    const past = r.decided && r.decided.verdicts[n], cur = live ? (v[n] || {}) : past || {};
    return `<div class="hritem"><div style="font-weight:600">${n+1}. ${esc(t)}</div>
      ${live ? `<div class="verdict" role="radiogroup" aria-label="Decision for item ${n+1}">
          <button class="btn sm ap" role="radio" aria-checked="${cur.k==='approve'}" aria-pressed="${cur.k==='approve'}" data-a="verdict" data-v="${n}|approve">${I.check} Looks good</button>
          <button class="btn sm ch" role="radio" aria-checked="${cur.k==='changes'}" aria-pressed="${cur.k==='changes'}" data-a="verdict" data-v="${n}|changes">${I.x} Needs changes</button>
          <button class="btn sm df" role="radio" aria-checked="${cur.k==='defer'}" aria-pressed="${cur.k==='defer'}" data-a="verdict" data-v="${n}|defer">${I.pause} Defer</button></div>
        ${cur.k === 'changes' ? `<label class="f" for="note-${n}">What needs to change <b style="color:var(--bad)">(required)</b></label><textarea id="note-${n}" data-t="note-${i.id}-${n}" placeholder="What you saw, and what you expected">${esc(S.text['note-'+i.id+'-'+n] || '')}</textarea>
          <div class="row wrap" style="margin-top:6px"><span class="src">Send it back as</span><div class="seg" role="group" aria-label="Turn finding into"><button data-a="into" data-v="${n}|checklist" aria-pressed="${(cur.into || 'checklist')==='checklist'}">Checklist item on this ticket</button><button data-a="into" data-v="${n}|bug" aria-pressed="${cur.into==='bug'}">New bug ticket</button></div></div>` : ''}
        ${cur.k === 'defer' ? `<label class="f" for="note-${n}">Why defer, and what's still needed (optional)</label><textarea id="note-${n}" data-t="note-${i.id}-${n}" placeholder="e.g. Needs a real Android device; test with the next mobile pass">${esc(S.text['note-'+i.id+'-'+n] || '')}</textarea>
          <div class="row wrap" style="margin-top:6px"><span class="src">Follow-up</span><div class="seg" role="group" aria-label="Follow-up for the deferred item"><button data-a="follow" data-v="${n}|ticket" aria-pressed="${(cur.follow || 'ticket')==='ticket'}">Create a test ticket in Inbox</button><button data-a="follow" data-v="${n}|none" aria-pressed="${cur.follow==='none'}">No ticket: agent follows the project workflow</button></div></div>
          <div class="src" style="margin-top:4px">Deferring clears the gate so work can continue. The item is recorded as <b>not verified</b>, never as approved.</div>` : ''}`
      : past ? `<div class="row wrap" style="margin-top:6px">${prov(({approve:'owner', changes:'ownerch', defer:'ownerdef'})[past.k], ({approve:'Looked good', changes:'Needed changes', defer:'Deferred · not verified'})[past.k])}${past.note ? `<span>“${esc(past.note)}”</span>` : ''}${past.k==='changes' ? `<span class="src">→ ${past.into==='bug' ? `bug ${past.ref ? link(past.ref) : ''}` : 'checklist item'}</span>` : ''}${past.k==='defer' ? `<span class="src">→ ${past.ref ? `test ticket ${link(past.ref)}` : 'agent follows the project workflow'}</span>` : ''}</div>` : ''}</div>`; }).join('');
  const allSet = live && hrOf(i).filter(h => h.state==='ready').every((h, n) => v[n] && v[n].k);
  const anyCh = live && Object.values(v).some(x => x && x.k === 'changes');
  const nDef = live ? Object.values(v).filter(x => x && x.k === 'defer').length : 0;
  return `<h1>Human review</h1>
  <div class="rv">
    <div class="card rvq">${ready.length ? `<div class="sectionhead"><h3>Ready for you · ${ready.length}</h3></div>${ready.map(qbtn).join('')}` : ''}
      ${!packetReady(i) ? `<div class="sectionhead"><h3>Viewing</h3></div>${qbtn(i)}` : ''}
      ${!ready.length ? '<div class="pad src">Nothing else is waiting on you.</div>' : ''}</div>
    <div class="card packet" style="min-width:0">
      <div class="vers"><b style="margin-right:4px">${link(i.id)} ${esc(i.title)}</b>
        ${pk.rounds.map(x => `<button class="vbtn" data-a="pkround" data-v="${x.n}" aria-pressed="${x===r}">Round ${x.n} ${x.decided ? `<span class="chip ${x.decided.verdicts.every(y => y.k==='approve') ? 'c-ok' : 'c-warn'}" style="padding:0 5px">${x.decided.verdicts.every(y => y.k==='approve') ? 'approved' : 'sent back'}</span>` : x===latest && packetReady(i) ? '<span class="dot needs" style="width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block"></span>' : ''}</button>`).join('')}
        <span class="src" style="margin-left:auto">${esc(r.by)} · ${esc(r.when)} · <span class="mono">${esc(r.sha)}</span>${r.commit ? ` · built from <span class="mono">${esc(r.commit)}</span>` : ''} · about ${esc(r.est)}</span></div>
      ${r !== latest ? `<div class="callout warn" style="margin:10px 14px 0">Earlier round. Its decisions are shown below and don't carry over.</div>` : ''}
      ${live && pkStale(i) ? `<div class="callout bad row wrap" style="margin:10px 14px 0"><span class="grow"><b>Out of date.</b> This packet was built from <span class="mono">${esc(r.commit)}</span>, but ${esc(i.lead || 'an agent')} ${esc(i.headNote || 'reported a newer commit for this ' + (isEpic(i) ? 'epic' : 'ticket'))}. What you verify may not match the code.</span><button class="btn sm" data-a="refresh" data-v="${i.id}">Ask for a fresh packet</button></div>` : ''}
      <div class="doc" style="padding:6px 22px 18px">
        <section><h2>What you're verifying</h2>${itemsHtml}</section>
        ${r.how ? `<section><h2>How to verify</h2><ol style="margin:0;padding-left:20px">${r.how.map(h => `<li style="margin:3px 0">${esc(h)}</li>`).join('')}</ol></section>` : ''}
        ${r.checked ? `<section><h2>Already checked by the agent</h2>${r.checked.map(c => `<div class="lrow">${prov(c[1])}<span class="grow">${esc(c[0])}</span><span class="src">${esc(c[2])}</span></div>`).join('')}</section>` : ''}
        ${r.gaps ? `<section><h2>Known gaps</h2><ul style="margin:0;padding-left:20px">${r.gaps.map(g => `<li>${esc(g)}</li>`).join('')}</ul></section>` : ''}
        ${r.attach ? `<section><h2>Attachments</h2><div>${r.attach.map(a => `<button class="attach" data-a="doc" data-v="${esc(a[0])}|${esc(a[1])}|${esc(r.by)}|${esc(r.when)}">${small(I.clip)}<b>${esc(a[0])}</b><span class="src">${esc(a[1])}</span></button>`).join('')}</div></section>` : ''}
      </div>
    </div>
    <div class="stack">
      ${live ? `<div class="card pad"><h3>Your decision · round ${r.n}</h3>
          <div class="src">${Object.values(v).filter(x => x && x.k).length} of ${hrOf(i).filter(h => h.state==='ready').length} items decided</div>
          <button class="btn primary" style="margin-top:10px;width:100%;justify-content:center" data-a="submitpacket" ${allSet ? '' : 'disabled'}>${!allSet ? 'Decide every item first' : anyCh ? `Send back to ${esc(i.lead || 'the agent')}` : nDef ? `Close ticket (${nDef} deferred)` : 'Approve and close ticket'}</button>
          <div class="callout" style="margin-top:10px">${anyCh ? `Each finding becomes a checklist item or a bug. The ticket goes back to In progress and you'll get a round ${r.n + 1} packet.${nDef ? ' Deferred items stay deferred.' : ''}` : nDef ? `Closes ${i.id}. ${nDef} item${nDef===1?' is':'s are'} recorded as deferred, not verified; nothing is marked approved that you didn't check.` : `Approving records your decision on <span class="mono">${esc(r.sha)}</span> and closes ${i.id}${dependents(i.id).length ? `, which unblocks ${dependents(i.id).map(x => x.id).join(', ')}` : ''}.`}</div></div>`
        : `<div class="card pad"><h3>Round ${r.n}</h3><div class="src">${r.decided ? `Decided ${esc(r.decided.when)}` : 'Not decided'}</div></div>`}
    </div>
  </div>`;
};

/* ---------- Timeline ---------- */
V.timeline = () => { S.workMode = 'timeline'; return V.work(); };
function timelineBody(){
  const start = D('2026-11-02'), days = 35;
  const pct = d => ((d - start) / 864e5 / days * 100);
  const rows = items.filter(i => i.start && !isEpic(i) && inScope(i) && !i.arch).sort((a,b) => D(a.start) - D(b.start));
  const undated = items.filter(i => !i.start && !isEpic(i) && isOpen(i) && inScope(i));
  const fcProj = S.scope === 'all' ? 'RCP' : S.scope, have = fcProj === 'RCP' ? 2 : 0;
  const endX = s => pct(new Date(D(s).getTime() + 864e5));
  const nowX = pct(NOW);
  const row = i => {
    const risks = dateRisks(i), done = i.status === 'done';
    const s = pct(D(i.start)), e = endX(i.end);
    const deps = unresolved(i).filter(b => byId[b].end).map(b => `<div class="dep ${risks.includes(b)?'risk':''}" style="left:${endX(byId[b].end)}%" title="${b} planned to finish ${fmt(D(byId[b].end))}"></div>`).join('');
    const after = unresolved(i).filter(b => byId[b].end).map(b => `${risks.includes(b) ? '<b style="color:var(--bad)">' : ''}${b} ends ${fmt(D(byId[b].end))}${risks.includes(b) ? '</b>' : ''}`);
    const overdue = !done && D(i.end) < D(NOW.toISOString().slice(0,10));
    return `<div class="tl-row"><div class="lbl">${typeIcon(i)}${link(i.id)}<span class="t" title="${esc(i.title)}">${esc(i.title)}</span></div>
      <div class="track">
        <div class="today" style="left:${nowX}%"></div>${deps}
        <div class="bar planned ${risks.length ? 'risk' : ''} ${done ? 'done' : ''}" style="left:${s}%;width:${e-s}%" title="Planned ${fmt(D(i.start))} → ${fmt(D(i.end))} · set by ${esc(i.setBy)}">${risks.length ? '⚠ blocker ends later' : overdue ? 'overdue' : done ? '✓ done' : isBlocked(i) ? '⊘ blocked' : ''}</div>
        ${i.actual ? `<div class="bar actual" style="left:${pct(D(i.actual[0]))}%;width:${(i.actual[1] ? Math.min(endX(i.actual[1]), nowX) : nowX) - pct(D(i.actual[0]))}%" title="Actual run time"></div>` : ''}
        ${after.length ? `<div class="setby" style="left:calc(${s}% + 1px)">after ${after.join(', ')}</div>` : ''}
      </div></div>`;
  };
  const fcStart = pct(D('2026-11-24')), fcEnd = endX('2026-12-03');
  const fc = S.fcPreview && fcProj === 'RCP'
    ? `<div class="bar forecast" style="left:${fcStart}%;width:${fcEnd-fcStart}%">P50 Nov 24 – P85 Dec 3</div><div class="setby" style="left:calc(${fcStart}% + 1px)">preview · 6.2 pts/wk over the last 4 weeks · n=11 · 80% range</div><button class="btn ghost sm" data-a="fc" style="position:absolute;left:8px;top:10px">Hide preview</button>`
    : `<div style="position:absolute;left:10px;top:12px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)">No forecast yet: needs 8 completed items with effort (have ${have}). ${fcProj === 'RCP' ? '<button class="btn ghost sm" data-a="fc">Preview what it will look like</button>' : ''}</div>`;
  return `<div class="card" style="overflow:auto;margin-top:10px"><div style="min-width:860px">
      <div class="weeks"><div></div><div style="display:grid;grid-template-columns:repeat(5,1fr)">${['Nov 2','Nov 9','Nov 16','Nov 23','Nov 30'].map(w => `<div class="w"><span>${w}</span></div>`).join('')}</div></div>
      ${rows.map(row).join('')}
      <div class="tl-row" style="background:var(--panel-2)"><div class="lbl"><b>Forecast · ${P[fcProj].short} backlog</b></div><div class="track">${fc}</div></div>
    </div></div>
    <div class="row wrap" style="margin-top:10px;justify-content:space-between">
      <div class="legend"><span><span class="bar planned" style="position:static;width:26px;height:12px"></span>Entered plan</span><span><span class="bar actual" style="position:static;width:26px"></span>Actual</span><span><span class="bar forecast" style="position:static;width:26px;height:12px"></span>Forecast (computed)</span><span><span style="display:inline-block;width:0;height:14px;border-left:2px dashed var(--ink-3)"></span>Blocker's planned end</span><span><span style="display:inline-block;width:0;height:14px;border-left:2px solid var(--bad)"></span>Now</span></div>
      <div class="src" style="flex-basis:100%">Not on the timeline (no dates): ${undated.map(i => link(i.id)).join(', ') || 'none'}</div></div>`;
}

function modalHtml(){

    const its = items.filter(i => !q || i.id.toLowerCase().includes(q) || i.title.toLowerCase().includes(q)).slice(0, 8);

      ${labs.length ? `<div class="grp">Labels</div>${labs.map(l => `<button class="pi${hi()}" data-a="pallabel" data-v="${l}"><span class="grow"># ${l}</span><span class="src">${P[LABELS[l].proj].short}</span></button>`).join('')}` : ''}
      ${vs.length ? `<div class="grp">Go to</div>${vs.map(v => `<button class="pi${hi()}" data-a="palnav" data-v="${v[0]}"><span class="grow">${v[1]}</span></button>`).join('')}` : ''}`;

      <input id="palq" placeholder="Search items, IDs, labels or views…" value="${esc(m.q || '')}" aria-label="Search" autocomplete="off">
      <div class="res">${res.trim() || '<div class="pad muted">No matches in the sample data.</div>'}</div>
      <div class="pad src" style="border-top:1px solid var(--line)">↑↓ to move · Enter to open · Esc to close</div></div></div>`;

        <label><span class="f" style="margin-top:0">Project</span><select data-a="newf" data-v="proj">${Object.values(P).map(p => `<option value="${p.key}" ${f.proj===p.key?'selected':''}>${p.short}</option>`).join('')}</select></label>
        <label><span class="f" style="margin-top:0">Epic (optional)</span><select data-a="newf" data-v="epic"><option value="">No epic</option>${eps.map(e => `<option value="${e.id}" ${f.epic===e.id?'selected':''}>${esc(e.title)}</option>`).join('')}</select></label></div>
      <label class="f" for="new-notes">Notes (optional)</label><textarea id="new-notes" data-t="new-notes" placeholder="Anything you already know. You'll shape it properly in Planning.">${esc(S.text['new-notes'] || '')}</textarea>`,
      '<button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="createitem">Add to Inbox</button>');
  }
  if (m.type === 'doc'){
    const t = docText(m.name);
    return wrap(esc(m.name), `<div class="src" style="margin-bottom:8px">${esc(m.ver)} · ${esc(m.by)} · ${esc(m.when)} · stored locally with the project</div>
      ${t ? `<div class="docview">${mdHtml(t)}</div>` : `<div class="media">${small(I.clip)} ${esc(m.ver)}: preview appears here</div>`}`,
      `<button class="btn" data-a="dldoc">Download</button><button class="btn" data-a="close">Close</button>`);
  }
  if (m.type === 'plan'){
    const d = DETAIL[S.ticket];
    return wrap(`Checklist history · ${S.ticket}`, `<div class="hv">${[...d.history].reverse().map(h => `<div class="ver"><div class="row" style="justify-content:space-between"><b>v${h.v}</b><span class="src">${h.by} · ${h.at}</span></div><div class="src" style="margin:2px 0 6px">${esc(h.note)}</div>${h.ops.map(o => `<div class="${o[0]==='+'?'add':o[0]==='-'?'rm':''}">${o[0]==='=' ? '' : o[0]+' '}${esc(o[1])}</div>`).join('')}</div>`).join('')}</div>
      <div class="src" style="margin-top:10px">Earlier versions are kept so you can see how scope changed without reading a transcript.</div>`, '<button class="btn" data-a="close">Close</button>');
  }
  if (m.type === 'release'){
    return wrap(`Release lead claim on ${m.id}?`, `<p style="margin-top:0">codex · orca-w1 has been silent for 47 minutes. Releasing will:</p>
      <ul style="margin:0 0 8px;padding-left:18px"><li>mark run r-58 as <b>interrupted</b>, not finished</li><li>keep its checklist, log and partial work on the ticket</li><li>move ${m.id} back to Ready so another agent can claim it</li></ul>
      <div class="src">If codex comes back, it gets a conflict response with the current state.</div>`,
      `<button class="btn" data-a="close">Cancel</button><button class="btn danger" data-a="confirmrelease" data-v="${m.id}">Release claim</button>`);
  }
  if (m.type === 'delete'){
    const p = P[m.key], n = items.filter(i => i.proj===m.key).length, ok = (m.typed || '') === m.key;
    return wrap(`Delete ${esc(p.name)}?`, `<p style="margin-top:0">This permanently removes <b>${n} work items</b>, their checklists, runs and history, and <b>${p.docs} local documents</b> including handoff packets. Agents will get “not found” for these IDs.</p>
      <div class="callout warn">Backups keep a copy until their 14-day retention ends. Removing the Docker container alone doesn't delete data.</div>
      <label class="f" for="deltype">Type <b class="mono">${m.key}</b> to confirm</label><input class="input" id="deltype" value="${esc(m.typed || '')}" autocomplete="off">`,
      `<button class="btn" data-a="close">Cancel</button><button class="btn danger" data-a="confirmdel" ${ok ? '' : 'disabled'}>Delete project</button>`);
  }
  return '';
}

/* =====================================================================

const TITLES = {attention:'Needs you', work:'Work', review:'Human review', agents:'Agents', settings:'Settings', timeline:'Work', connections:'Settings', projects:'Settings'};
const fkey = el => (el && el.dataset) ? (el.dataset.a ? `${el.dataset.a}|${el.dataset.v || ''}` : el.dataset.t ? `t|${el.dataset.t}` : el.id ? `#${el.id}` : null) : null;
function render(){
  if (S.view === 'ticket' && !byId[S.ticket]) S.view = 'attention';
  const ae = document.activeElement, k = fkey(ae);
  const caret = ae && typeof ae.selectionStart === 'number' ? ae.selectionStart : null;
  renderNav();
  $('#view').innerHTML = V[S.view]();
  renderTabs();
  const i = byId[S.ticket];
  const globalView = ['settings','connections','projects'].includes(S.view);
  $('#crumbs').innerHTML = S.view === 'ticket' ? `<span>${P[i.proj].short}</span> / ${i.epic && byId[i.epic] ? `<a href="#" data-a="open" data-v="${i.epic}">◆ ${esc(byId[i.epic].title)}</a>` : '<a href="#" data-a="nav" data-v="work">Work</a>'} / <span class="mono">${i.id}</span> <b>${esc(i.title)}</b>`
    : S.view === 'label' ? `<a href="#" data-a="nav" data-v="work">Work</a> / <b>#${esc(S.label)}</b>`
    : S.view === 'review' ? `<a href="#" data-a="nav" data-v="attention">Needs you</a> / <b>Human review · ${esc(S.pk || '')}</b>`
    : globalView ? `<b>${TITLES[S.view]}</b> <span class="scopebar">Service-wide</span>` : `<span>${S.scope === 'all' ? 'All projects' : P[S.scope].short}</span> / <b>${TITLES[S.view]}</b>`;
  if (S.theme === 'system') $('#app').removeAttribute('data-theme'); else $('#app').setAttribute('data-theme', S.theme);
  const dark = S.theme==='dark' || (S.theme==='system' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themebtn').innerHTML = dark ? I.sun : I.moon;
  $('#themebtn').setAttribute('aria-label', `Theme: ${S.theme}. Switch theme`);
  $('#themebtn').title = `Theme: ${S.theme}`;
  drawMaps();
  $('#modal').innerHTML = modalHtml();
  if (S.modal){
    const f = S.modal.type==='palette' ? $('#palq') : S.modal.type==='delete' ? $('#deltype') : S.modal.type==='new' ? (document.activeElement && document.activeElement.closest && document.activeElement.closest('.dlg') ? null : $('#new-title')) : $('.dlg footer .btn');
    if (f){ f.focus(); if (f.type !== 'checkbox' && typeof f.value === 'string' && f.setSelectionRange) try { f.setSelectionRange(f.value.length, f.value.length); } catch(_){} }
    return;
  }
  if (k){
    const el = [...document.querySelectorAll('#app [data-a],#app [data-t],#app [id]')].find(e => fkey(e) === k);
    if (el){ el.focus({preventScroll:true}); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch(_){} }
  }
}
function rememberTab(){ if (S.view === 'ticket' && byId[S.ticket]) S.tabMem[S.ticket] = {tab:S.tab, epicTab:S.epicTab}; }
function go(view, opts={}){ if (view === 'timeline'){ view = 'work'; opts = Object.assign({workMode:'timeline'}, opts); } if (view === 'projects' || view === 'connections') view = 'settings'; rememberTab(); Object.assign(S, opts); S.view = view; if (view !== 'ticket') S.lastPage = view; render(); $('#view').focus({preventScroll:true}); }
function openTicket(id, epicTab){ rememberTab(); const m = S.tabMem[id] || {}; S.ticket = id; S.tab = m.tab || null; S.epicTab = epicTab || m.epicTab || 'details';
  if (!S.openTabs.includes(id)){ S.openTabs.push(id); while (S.openTabs.length > 8){ const k = S.openTabs.findIndex(x => x !== id); S.openTabs.splice(k, 1); } }
  S.view = 'ticket'; render(); $('#view').focus({preventScroll:true}); }
function renderTabs(){
  S.openTabs = S.openTabs.filter(id => byId[id]);
  if (S.view === 'ticket' && byId[S.ticket] && !S.openTabs.includes(S.ticket)) S.openTabs.push(S.ticket);
  $('#tabstrip').innerHTML = S.openTabs.length ? S.openTabs.map(id => { const i = byId[id], on = S.view === 'ticket' && S.ticket === id;
    return `<div class="otab" role="presentation" aria-selected="${on}"><button class="og" role="tab" aria-selected="${on}" data-a="tabgo" data-v="${id}" title="${esc(i.title)}">${typeIcon(i)}<span class="mono">${id}</span><span class="tt2">${esc(i.title)}</span></button><button class="ox" data-a="tabclose" data-v="${id}" aria-label="Close ${id}">${small(I.x)}</button></div>`; }).join('') : ''; }

  rmcheck: v => { const [id, n] = v.split('|'), before = snap(), c = DETAIL[id].checks[+n]; DETAIL[id].checks.splice(+n, 1); logActivity(id, `You removed an agent review item: “${c[0]}”`); undoable(before, 'Agent review item removed.'); },
  hradd: v => { const t = (S.text['hrnew-'+v] || '').trim(); if (!t){ toast('Write what you need to verify.'); const el = document.getElementById('hrnew-'+v); if (el) el.focus(); return; }

    const before = snap(), h = byId[id].hr[+n], old = h.t; h.t = t; S.hrEdit = null; logActivity(id, `You edited a human review item: “${old}” → “${t}”`); undoable(before, 'Review item updated.'); },
  hrdel: v => { const [id, n] = v.split('|'), before = snap(), h = byId[id].hr[+n]; byId[id].hr.splice(+n, 1); logActivity(id, `You removed a human review item: “${h.t}”`); undoable(before, 'Review item removed.'); },
  newitem: () => { S.newF = {type:'Story', proj: S.scope === 'all' ? 'RCP' : S.scope, epic:''}; S.text['new-title'] = ''; S.text['new-notes'] = ''; S.modal = {type:'new'}; render(); },
  createitem: () => { const t = (S.text['new-title'] || '').trim(); if (!t){ toast('Give it a title.'); const el = $('#new-title'); if (el) el.focus(); return; }
    const before = snap(), f = S.newF, nid = nextId(f.proj);

  doc: v => { const [name, ver, by, when] = v.split('|'); S.modal = {type:'doc', name, ver, by, when}; render(); },

  workfilter: v => go('work', {filter:v, epicF:'all', labelF:'all', workMode:'board', showBlocked:false}),
