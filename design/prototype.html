<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Lite — UI prototype (rev 2)</title>
<!--
  Clickable UI/UX prototype for the local agent work tracker (MVP V1), revision 2.
  Self-contained: no network requests, no build step. All data is disposable sample work (O09).
  Design rationale and requirement mapping: docs/UI_DESIGN.md
-->
<style>
/* ---------- tokens (contrast-checked: text >= 4.5:1, control borders >= 3:1) ---------- */
.tl{
  --bg:#f6f7f9; --panel:#fff; --panel-2:#f1f3f6; --line:#e3e6eb; --line-2:#d3d8df; --ctl:#8a929f;
  --ink:#16191f; --ink-2:#444c59; --ink-3:#5f6878; --on-fill:#fff;
  --brand:#3b5bdb; --brand-soft:#e8edff;
  --ok:#237032; --ok-soft:#e6f4ea; --warn:#9a4705; --warn-soft:#fdf1e2;
  --bad:#c22b2b; --bad-soft:#fdecec; --info:#1864ab; --info-soft:#e7f1fb;
  --violet:#6741d9; --violet-soft:#f0ebff; --gray-soft:#eef0f3; --teal:#0b7285; --teal-soft:#e3f6f8;
  --shadow:0 12px 40px rgba(20,25,35,.18);
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  font:13px/1.45 var(--sans); color:var(--ink); background:var(--bg); color-scheme:light;
}
.tl[data-theme=dark]{
  --bg:#0f1115;--panel:#161920;--panel-2:#1c2029;--line:#2a303b;--line-2:#363d4a;--ctl:#6f788a;
  --ink:#e6e9ef;--ink-2:#b8c0cc;--ink-3:#99a2b4;--on-fill:#0f1115;
  --brand:#8ea2ff;--brand-soft:#1d2440;--ok:#5bd06f;--ok-soft:#14281a;--warn:#f0a020;--warn-soft:#2d2210;
  --bad:#ff7b7b;--bad-soft:#351818;--info:#5cb3f8;--info-soft:#132536;--violet:#a990ff;--violet-soft:#241c3e;--gray-soft:#23272f;--teal:#3bc9db;--teal-soft:#10292d;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  .tl:not([data-theme=light]){
    --bg:#0f1115;--panel:#161920;--panel-2:#1c2029;--line:#2a303b;--line-2:#363d4a;--ctl:#6f788a;
    --ink:#e6e9ef;--ink-2:#b8c0cc;--ink-3:#99a2b4;--on-fill:#0f1115;
    --brand:#8ea2ff;--brand-soft:#1d2440;--ok:#5bd06f;--ok-soft:#14281a;--warn:#f0a020;--warn-soft:#2d2210;
    --bad:#ff7b7b;--bad-soft:#351818;--info:#5cb3f8;--info-soft:#132536;--violet:#a990ff;--violet-soft:#241c3e;--gray-soft:#23272f;--teal:#3bc9db;--teal-soft:#10292d;
    --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
  }
}
.tl *{box-sizing:border-box}
.tl button,.tl select,.tl input,.tl textarea{font:inherit;color:inherit}
.tl button{cursor:pointer}
.tl a{color:var(--brand);text-decoration:none;cursor:pointer}
.tl a:hover{text-decoration:underline}
.tl :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.tl .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tl .mono{font-family:var(--mono);font-size:12px}
.tl .muted{color:var(--ink-3)}
.tl .src{font-size:12px;color:var(--ink-3)}
.tl .row{display:flex;align-items:center;gap:8px}
.tl .wrap{flex-wrap:wrap}
.tl .grow{flex:1;min-width:0}
.tl .stack{display:grid;gap:12px}
.tl .grid2{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.tl h1{font-size:19px;margin:0 0 2px;font-weight:650;letter-spacing:-.01em}
.tl h2{font-size:14px;margin:0;font-weight:650}
.tl h3{font-size:11.5px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650}
.tl .sub{color:var(--ink-3);margin:2px 0 14px}
.tl .card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.tl .pad{padding:12px 14px}

/* ---------- shell ---------- */
.tl .shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:820px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.tl .logo{display:flex;align-items:center;gap:8px;font-weight:700;padding:2px 8px 14px}
.tl .logo i{width:24px;height:24px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:var(--on-fill);font-style:normal;font-size:11px;flex:none}
.tl .navbtn{display:flex;align-items:center;gap:10px;min-height:32px;padding:5px 9px;border-radius:7px;border:0;background:none;text-align:left;color:var(--ink-2);width:100%}
.tl .navbtn svg{width:16px;height:16px;flex:none}
.tl .navbtn:hover{background:var(--panel-2)}
.tl .navbtn[aria-current=page]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tl .badge{margin-left:auto;font-size:11px;background:var(--bad);color:var(--on-fill);border-radius:9px;padding:0 6px;font-weight:700;min-width:18px;text-align:center}
.tl .badge.n{background:var(--gray-soft);color:var(--ink-2)}
.tl .navsec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:14px 9px 4px;font-weight:650}
.tl .sw{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.tl .health{margin-top:auto;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:12px;color:var(--ink-2);display:grid;gap:4px;text-align:left;background:none;width:100%}
.tl .health:hover{background:var(--panel-2)}
.tl main{display:flex;flex-direction:column;min-width:0}
.tl header{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.tl .crumbs{color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .crumbs b{color:var(--ink);font-weight:600}
.tl .search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--ctl);background:var(--panel-2);border-radius:8px;padding:5px 10px;width:300px;color:var(--ink-3);text-align:left}
.tl kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--ctl);border-radius:4px;padding:0 4px;color:var(--ink-3);background:var(--panel)}
.tl .iconbtn{border:1px solid var(--ctl);background:var(--panel);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;flex:none}
.tl .iconbtn svg{width:16px;height:16px}
.tl .view{padding:18px 20px 28px;flex:1;min-width:0;outline:none}
@media (max-width:1180px){
  .tl .shell{grid-template-columns:60px minmax(0,1fr)}
  .tl nav .nl,.tl nav .navsec,.tl nav .projlink,.tl .logo span,.tl .health .hx{display:none}
  .tl .navbtn{justify-content:center;position:relative}
  .tl .navbtn .badge{position:absolute;top:0;right:2px;margin:0}
  .tl .health{place-items:center}
  .tl .grid2{grid-template-columns:minmax(0,1fr) 270px}
  .tl .search{width:220px}
}

/* ---------- project scope switcher ---------- */
.tl .scopewrap{position:relative;margin:0 0 10px}
.tl .scopebtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--ctl);background:var(--panel);border-radius:8px;padding:6px 9px;text-align:left;min-height:36px}
.tl .scopebtn:hover{background:var(--panel-2)}
.tl .scopebtn .lbl2{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650;display:block;line-height:1.1}
.tl .scopebtn .nm{font-weight:650;display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .scopemenu{position:absolute;left:0;top:calc(100% + 4px);width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:15}
.tl .scopemenu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;border-radius:7px;padding:7px 9px;text-align:left;min-height:34px}
.tl .scopemenu button:hover,.tl .scopemenu button[aria-checked=true]{background:var(--brand-soft)}
.tl .scopemenu .hint{font-size:12px;color:var(--ink-3);padding:6px 9px 2px;border-top:1px solid var(--line);margin-top:4px}
.tl .scopebar{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.tl .pdocs{display:flex;gap:4px;flex-wrap:wrap}
.tl .pdoc{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:5px;padding:0 6px;line-height:18px;border:1px solid transparent}
.tl .pd-approved{background:var(--ok-soft);color:var(--ok)}
.tl .pd-review{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.tl .pd-drafting{border:1.5px dashed var(--violet);color:var(--violet)}
.tl .pd-none{border:1px dashed var(--ctl);color:var(--ink-3)}
.tl .gnode.ext rect.b{fill:var(--panel-2);stroke-dasharray:4 3}
@media (max-width:1180px){.tl .scopebtn .txt,.tl .scopebtn .chev{display:none}.tl .scopebtn{justify-content:center;padding:6px}}

/* ---------- structure tree & labels ---------- */
.tl .tree{list-style:none;margin:0;padding:0}
.tl .tree .tree{padding-left:22px;border-left:1px dashed var(--line-2);margin-left:13px}
.tl .trow{display:grid;grid-template-columns:minmax(0,1fr) 150px 110px;gap:10px;align-items:center;padding:6px 10px;border-radius:7px}
.tl .trow:hover{background:var(--panel-2)}
.tl .trow.cont{font-weight:650}
.tl .tgroup{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650;padding:12px 10px 4px}
.tl .label{display:inline-flex;align-items:center;font-size:11.5px;border:1px solid var(--ctl);border-radius:4px;padding:0 5px;color:var(--ink-2);line-height:17px}
.tl .label::before{content:"#";color:var(--ink-3);margin-right:1px}
.tl .ptag{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tl .typetbl td,.tl .typetbl th{padding:6px 8px}
.tl .ti{display:inline-grid;place-items:center;width:16px;font-size:11px}

/* ---------- chips, status, priority ---------- */
.tl .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;font-weight:550;line-height:18px}
.tl .st-inbox{background:var(--gray-soft);color:var(--ink-2)}
.tl .st-planning{background:var(--teal-soft);color:var(--teal)}
.tl .st-ready{background:var(--info-soft);color:var(--info)}
.tl .st-progress{background:var(--violet-soft);color:var(--violet)}
.tl .st-review{background:var(--warn-soft);color:var(--warn)}
.tl .st-done{background:var(--ok-soft);color:var(--ok)}
.tl .st-canceled{background:var(--gray-soft);color:var(--ink-3);text-decoration:line-through}
.tl .c-bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.tl .c-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.tl .c-info{background:var(--info-soft);color:var(--info)}
.tl .c-gray{background:var(--gray-soft);color:var(--ink-2)}
.tl .c-ok{background:var(--ok-soft);color:var(--ok)}
.tl .type{font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
.tl .prio{display:inline-flex;align-items:center;gap:3px;font:600 11.5px var(--mono);color:var(--ink-2)}
.tl .prio svg{width:12px;height:12px}

/* ---------- run state: icon shape + text, never colour alone ---------- */
.tl .run{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.tl .ri{width:12px;height:12px;border-radius:50%;display:inline-grid;place-items:center;font:800 9px/1 var(--sans);font-style:normal;flex:none}
.tl .ri-live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent);animation:tlpulse 2s infinite}
.tl .ri-reported{border:2px solid var(--violet)}
.tl .ri-stale{border:1.5px dashed var(--ink-3)}
.tl .ri-needs{background:var(--warn);color:var(--on-fill)}
.tl .ri-failed{background:var(--bad);color:var(--on-fill)}
.tl .ri-finished{background:var(--gray-soft);color:var(--ink-2);border:1px solid var(--ctl)}
.tl .ri-interrupted{border:1.5px solid var(--ink-3);color:var(--ink-3)}
.tl .run-failed>span{color:var(--bad);font-weight:600}
.tl .run-needs>span{color:var(--warn);font-weight:600}
.tl .run-stale>span{color:var(--ink-3);font-style:italic}
@keyframes tlpulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.tl .ri-live{animation:none}.tl *{transition:none!important}}

/* ---------- provenance badges: each kind has its own border style + icon ---------- */
.tl .prov{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:6px;padding:1px 7px;font-weight:600;white-space:nowrap;line-height:17px}
.tl .prov svg{width:12px;height:12px;flex:none}
.tl .pv-owner{background:var(--ok);color:var(--on-fill)}
.tl .pv-agent{border:1.5px dashed var(--violet);color:var(--violet)}
.tl .pv-observed{border:1.5px solid var(--violet);color:var(--violet);background:var(--violet-soft)}
.tl .pv-relayed{border:1.5px dotted var(--ink-3);color:var(--ink-2)}
.tl .pv-auto{background:var(--info-soft);color:var(--info)}
.tl .pv-git{background:var(--gray-soft);color:var(--ink-2)}
.tl .pv-pending{border:1.5px solid var(--warn);color:var(--warn);background:var(--warn-soft)}

/* ---------- buttons & form controls ---------- */
.tl .btn{border:1px solid var(--ctl);background:var(--panel);border-radius:8px;min-height:30px;padding:4px 12px;font-weight:550;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tl .btn svg{width:14px;height:14px}
.tl .btn:hover{background:var(--panel-2)}
.tl .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-fill)}
.tl .btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-fill)}
.tl .btn.sm{min-height:28px;padding:2px 10px;font-size:12.5px}
.tl .btn:disabled{opacity:.55;cursor:not-allowed}
.tl .btn.ghost{border-color:transparent;background:none;color:var(--brand)}
.tl .seg{display:inline-flex;border:1px solid var(--ctl);border-radius:8px;overflow:hidden}
.tl .seg button{border:0;background:var(--panel);min-height:28px;padding:3px 11px;border-right:1px solid var(--ctl)}
.tl .seg button:last-child{border-right:0}
.tl .seg button[aria-pressed=true]{background:var(--brand-soft);color:var(--brand);font-weight:650}
.tl .fchip{border:1px solid var(--ctl);border-radius:999px;min-height:28px;padding:2px 11px;background:var(--panel);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.tl .fchip b{font-weight:700}
.tl .fchip[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tl textarea,.tl .input,.tl select{width:100%;border:1px solid var(--ctl);border-radius:8px;padding:7px 9px;background:var(--panel);color:var(--ink)}
.tl textarea{min-height:72px;resize:vertical}
.tl select{width:auto;padding:3px 8px;min-height:28px}
.tl label.f{display:block;font-size:12px;color:var(--ink-3);margin:10px 0 4px}

/* ---------- needs you ---------- */
.tl .filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tl .att{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.tl .att:first-child{border-top:0}
.tl .att:hover{background:var(--panel-2)}
.tl .att.decision{background:color-mix(in srgb,var(--warn-soft) 55%,transparent)}
.tl .att.decision:hover{background:var(--warn-soft)}
.tl .att .why{color:var(--ink-2);margin-top:2px}
.tl .att .t{font-weight:600}
.tl .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.tl .ico svg{width:15px;height:15px}
.tl .reply{margin-top:8px;display:grid;gap:6px;cursor:default}
.tl .agent-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:9px 14px;border-top:1px solid var(--line)}
.tl .agent-row:first-of-type{border-top:0}
.tl .chg{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:6px 14px;font-size:12.5px;border-top:1px solid var(--line)}
.tl .chg:first-of-type{border-top:0}
.tl .sectionhead{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 7px}
.tl .sectionhead h3{margin:0}

/* ---------- work ---------- */
.tl .board{display:grid;grid-template-columns:repeat(6,minmax(176px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.tl .col{background:var(--panel-2);border-radius:10px;padding:8px;min-height:440px}
.tl .colh{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;font-weight:650;font-size:12.5px;color:var(--ink-2)}
.tl .subh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2);padding:8px 4px 6px;border-top:1px dashed var(--ctl);margin-top:4px}
.tl a.tcard{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;color:var(--ink);text-decoration:none}
.tl a.tcard:hover{border-color:var(--brand);text-decoration:none}
.tl a.tcard.isblocked{border-left:3px solid var(--bad)}
.tl a.tcard.owed{border-left:3px solid var(--warn)}
.tl .tcard .t{font-weight:600;line-height:1.3}
.tl .tcard .mono,.tl .type{white-space:nowrap}
.tl .tcard .prov,.tl .tcard .chip{white-space:normal;line-height:16px;padding-top:1px;padding-bottom:1px}
.tl .tcard .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.tl .mini{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px 6px}
.tl table{width:100%;border-collapse:collapse}
.tl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line)}
.tl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tl tbody tr:hover{background:var(--panel-2)}
.tl tr.clickrow{cursor:pointer}

/* ---------- ticket ---------- */
.tl .tk-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.tl .banner{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.tl .banner>svg{width:18px;height:18px;flex:none;color:var(--warn)}
.tl .banner.q{align-items:flex-start}
.tl .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tl .tabs button{border:0;background:none;padding:7px 10px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:32px}
.tl .tabs button[aria-selected=true]{color:var(--ink);border-color:var(--brand);font-weight:650}
.tl .step{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.tl .step:first-child{border-top:0}
.tl .sicon{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;margin-top:1px;flex:none}
.tl .s-done{background:var(--ok);color:var(--on-fill)}
.tl .s-current{border:2px solid var(--violet)}
.tl .s-current::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--violet)}
.tl .s-planned{border:1.5px dashed var(--ctl)}
.tl .s-blocked{background:var(--bad);color:var(--on-fill)}
.tl .s-skipped{background:var(--gray-soft);color:var(--ink-3);border:1px solid var(--ctl)}
.tl .step .title{font-weight:600}
.tl .step s{color:var(--ink-3);font-weight:400}
.tl .contrib{margin-top:6px;border-left:2px solid var(--line-2);padding:4px 0 4px 10px;font-size:12.5px;color:var(--ink-2);display:grid;gap:3px}
.tl .changed{font-size:12px;color:var(--warn);margin-top:3px}
.tl .ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.tl .ev:first-child{border-top:0}
.tl .ev .d{font-size:12px;color:var(--ink-3);grid-column:1/-1}

    if (i.closedBy === 'agent' && !S.ackEvidence[i.id]) q.push({id:i.id, tags:['evidence'], icon:'evidence', rank:3, why:'Closed by agent completion (this project has no owner gate). Acceptance #2 has no linked evidence.', action:'Open', a:'open', v:i.id});
  }
  if (cyc.size){
    const ids = [...cyc].sort();

  return q.filter(r => inScope(byId[r.id])).sort((a,b) => a.rank - b.rank || b.holds.length - a.holds.length);
}

function toast(msg, undo){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-a="toastundo">Undo</button>' : ''}`;
  t._undo = undo; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), undo ? 6000 : 3200);
}
function logActivity(id, text){ (S.extraActivity[id] = S.extraActivity[id] || []).unshift(['now', text]); }

function renderNav(){
  const dec = decisions().length;
  const pendingReviews = Object.keys(REVIEWS).filter(k => !S.decided[k] && inScope(byId[k])).length;
  const runs = items.filter(i => inScope(i) && ['live','needs','stale','failed','reported'].includes(i.run)).length;
  const btn = (v, icon, label, badge) => `<button class="navbtn" data-a="nav" data-v="${v}" aria-current="${S.view===v || (v==='work' && S.view==='ticket') ? 'page' : 'false'}" title="${label}">${I[icon]}<span class="nl">${label}</span>${badge || ''}</button>`;
  const cur = S.scope === 'all' ? null : P[S.scope];
  const opt = (key, name, color) => { const n = decisionsIn(key).length; return `<button role="menuitemradio" aria-checked="${S.scope===key}" data-a="scope" data-v="${key}">${color ? `<span class="sw" style="background:${color};width:12px;height:12px"></span>` : small(I.folder)}<span class="grow">${name}</span>${n ? `<span class="badge" aria-label="${n} decisions owed">${n}</span>` : ''}</button>`; };

      <button class="scopebtn" data-a="scopemenu" aria-haspopup="menu" aria-expanded="${S.scopeOpen}" title="Project: ${cur ? cur.short : 'All projects'}">

        <span class="grow txt"><span class="lbl2">Project</span><span class="nm">${cur ? cur.short : 'All projects'}</span></span><span class="chev">${small(I.chev)}</span></button>
      ${S.scopeOpen ? `<div class="scopemenu" role="menu" aria-label="Choose project">${opt('all','All projects',null)}${Object.values(P).map(p => opt(p.key, p.short, p.color)).join('')}<div class="hint">Every page in this sidebar shows only the chosen project. Projects and Connections are always service-wide.</div></div>` : ''}
    </div>
    ${btn('attention','attention','Needs you', dec ? `<span class="badge" aria-label="${dec} decisions owed">${dec}</span>` : '')}
    ${btn('work','work','Work')}
    ${btn('reviews','reviews','Reviews', pendingReviews ? `<span class="badge" aria-label="${pendingReviews} pending">${pendingReviews}</span>` : '')}
    ${btn('graph','graph','Dependencies')}
    ${btn('timeline','timeline','Timeline')}

    <div class="navsec">Service-wide</div>
    ${btn('projects','folder','Projects')}
    ${btn('connections','plug','Connections')}
    <button class="health" data-a="nav" data-v="connections" aria-label="Service healthy. Open connections">
      <div class="row"><i class="ri" style="background:var(--ok);color:var(--on-fill)" aria-hidden="true">✓</i><span class="hx">Service healthy</span></div>
      <div class="hx mono" style="font-size:11.5px">127.0.0.1:7420/mcp</div>
      <div class="hx">3 clients connected</div>
    </button>`;
}
const scopePill = () => S.scope === 'all'
  ? `<span class="scopebar" style="vertical-align:middle;margin-left:6px">${small(I.folder)} All projects</span>`
  : `<span class="scopebar" style="vertical-align:middle;margin-left:6px"><span class="sw" style="background:${P[S.scope].color}"></span>${P[S.scope].short}</span>`;

/* =====================================================================
   Views

const V = {};

/* ---------- Needs you ---------- */
V.attention = () => {
  const q = queue();
  const tagDefs = [['all','All'],['decision','Decisions'],['stale','Stale runs'],['failed','Failed runs'],['blocked','Blocked'],['date','Date risk'],['evidence','Missing evidence']];
  const count = t => t === 'all' ? q.length : q.filter(r => r.tags.includes(t)).length;
  const list = q.filter(r => S.kpi === 'all' || r.tags.includes(S.kpi));
  const dec = decisions().length;
  const agents = items.filter(i => inScope(i) && ['live','needs','stale','failed','reported'].includes(i.run));
  const row = r => {
    const i = byId[r.id], k = KINDICON[r.icon], open = S.replyOpen === r.id;
    return `<div class="att ${r.tags.includes('decision') ? 'decision' : ''}" data-a="open" data-v="${r.id}">
      <div class="ico" style="background:${k[0]};color:${k[1]}">${I[r.icon]}</div>
      <div style="min-width:0">
        <div class="row wrap"><a href="#" data-a="open" data-v="${r.id}" class="t" style="color:var(--ink)">${esc(i.title)}</a><span class="mono muted">${r.id}</span>${i.lead ? run(i.run, i.age) : ''}</div>
        <div class="why">${esc(r.why)}</div>
        ${r.holds.length ? `<div class="src" style="margin-top:3px">Holds up ${r.holds.map(h => link(h)).join(', ')}</div>` : ''}
        ${r.reply && open ? `<div class="reply" data-stop>
            <label class="f" for="ans-${r.id}" style="margin:4px 0 0">Your answer to ${esc(i.question.by)}</label>
            <textarea id="ans-${r.id}" data-t="ans-${r.id}" placeholder="e.g. Per serving; link to the 100 g values in a footnote.">${esc(S.text['ans-'+r.id] || '')}</textarea>
            <div class="row wrap"><button class="btn primary sm" data-a="sendanswer" data-v="${r.id}">Send answer</button><button class="btn sm" data-a="reply" data-v="${r.id}">Cancel</button><span class="src">Posted to the ticket; ${esc(i.question.by)} reads it on its next query.</span></div>
          </div>` : ''}
      </div>
      ${r.reply && open ? '<span></span>' : `<button class="btn sm${r.tags.includes('decision') ? ' primary' : ''}" data-a="${r.a}" data-v="${r.v}">${r.action}</button>`}
    </div>`;
  };
  return `
  <h1>Needs you${scopePill()}</h1>
  <div class="sub">${dec ? `<b style="color:var(--warn)">${dec} decision${dec>1?'s':''} owed</b>: agents are waiting on these.` : 'No decisions owed.'} ${q.length - dec} other item${q.length-dec===1?'':'s'} to look at. Sorted by what unblocks the most work.</div>
  <div class="filters" role="group" aria-label="Filter queue">${tagDefs.map(([t,l]) => `<button class="fchip" data-a="kpi" data-v="${t}" aria-pressed="${S.kpi===t}">${l} <b>${count(t)}</b></button>`).join('')}</div>
  <div class="grid2">
    <div class="card">${list.map(row).join('') || '<div class="pad muted">Nothing here. Agents are unblocked.</div>'}</div>
    <div class="stack">
      <div class="card">
        <div class="sectionhead"><h3>Agents right now</h3><a href="#" data-a="nav" data-v="agents" style="font-size:12px">All runs</a></div>
        ${agents.map(i => `<div class="agent-row"><div style="min-width:0"><b>${esc(i.lead)}</b><div class="src" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${link(i.id)} ${esc(i.title)}</div></div>${run(i.run, i.age)}</div>`).join('') || '<div class="pad muted">No active runs.</div>'}
      </div>
      <div class="card">
        <div class="sectionhead"><h3>Since you looked at 08:30</h3></div>
        ${CHANGES.filter(c => inScope(byId[c[1]])).map(c => `<div class="chg"><span class="mono muted">${c[0]}</span><span>${link(c[1])} ${esc(c[2])}</span></div>`).join('')}
      </div>
    </div>
  </div>`;
};

/* ---------- Work ---------- */
const FILTERS = {
  all:['All', () => true, ''],
  planning:['In planning', i => i.status==='planning', 'status:planning'],
  startable:['Ready to start', i => i.status==='ready' && !isBlocked(i), 'status:ready -is:blocked'],
  blocked:['Blocked', isBlocked, 'is:blocked'],
  review:['Needs owner', i => !!owes(i), 'needs:owner'],
  live:['Live run', i => i.run==='live', 'run:live'],
  unclaimed:['Unclaimed', i => isOpen(i) && !i.lead, 'is:open lead:none'],
};
V.work = () => {
  const cols = ['inbox','planning','ready','progress','review','done'];
  const inProj = i => !isContainer(i) && inScope(i) && (S.typeF === 'all' || i.type === S.typeF);
  const list = items.filter(i => inProj(i) && FILTERS[S.filter][1](i));
  const card = i => {
    const o = owes(i), dr = dateRisks(i);
    return `<a href="#" class="tcard ${isBlocked(i) ? 'isblocked' : o ? 'owed' : ''}" data-a="open" data-v="${i.id}">
      <div class="row" style="justify-content:space-between"><span class="row"><span class="mono muted">${i.id}</span>${typeBadge(i)}</span>${prio(i.prio)}</div>
      <div class="t">${esc(i.title)}</div>
      ${parentTag(i) || (i.labels || []).length ? `<div class="meta">${parentTag(i)}${labelsOf(i)}</div>` : ''}
      ${pdocs(i)}
      ${isBlocked(i) || o || dr.length ? `<div class="meta">${blockedChip(i)}${owedChip(i)}${dr.length ? '<span class="chip c-bad">Date risk</span>' : ''}</div>` : ''}
      <div class="meta">${i.lead ? `${run(i.run, i.age)}<span>· ${esc(i.lead)}</span>` : '<span>Unclaimed</span>'}<span style="margin-left:auto" title="Last activity">${i.last}</span></div>
    </a>`;
  };
  const colHtml = c => {
    const cs = list.filter(i => i.status === c);
    if (c === 'ready'){
      const go = cs.filter(i => !isBlocked(i)), wait = cs.filter(isBlocked);
      return `<div class="col"><div class="colh"><span>Ready</span><span>${cs.length}</span></div>
        <div class="src" style="padding:0 4px 6px">Startable · ${go.length}</div>${go.map(card).join('') || '<div class="src" style="padding:0 4px 8px">Nothing startable</div>'}
        ${wait.length ? `<div class="subh"><span>Waiting on blockers · ${wait.length}</span><button class="btn ghost sm" data-a="toggleblocked" aria-expanded="${S.showBlocked}">${S.showBlocked ? 'Hide' : 'Show'}</button></div>
          ${S.showBlocked ? wait.map(card).join('') : `<div class="mini">${wait.map(i => `<a href="#" data-a="open" data-v="${i.id}" class="chip c-bad mono" title="${esc(i.title)}">${i.id}</a>`).join('')}</div>`}` : ''}
      </div>`;
    }
    return `<div class="col"><div class="colh"><span>${STATUS[c]}${c==='done' ? ' <span class="muted" style="font-weight:400">· 7 days</span>' : ''}</span><span>${cs.length}</span></div>${c==='planning' ? '<div class="src" style="padding:0 4px 6px">Planning docs in progress. Not claimable yet.</div>' : ''}${cs.map(card).join('')}</div>`;
  };
  const table = `<div class="card" style="overflow:auto"><table><thead><tr><th scope="col">ID</th><th scope="col">Title</th><th scope="col">Status</th><th scope="col">Priority</th><th scope="col">Lead · run</th><th scope="col">Blocked by</th><th scope="col">Last activity</th></tr></thead><tbody>
    ${list.map(i => `<tr class="clickrow" data-a="open" data-v="${i.id}"><td>${link(i.id)}</td><td>${esc(i.title)} ${typeBadge(i)} ${labelsOf(i)}<div class="ptag">${ancestors(i).reverse().map(a => esc(a.title)).join(' › ')}</div></td><td><div class="row wrap">${statusChip(i)}${owedChip(i)}</div></td><td>${prio(i.prio)}</td>
      <td>${i.lead ? `<div>${esc(i.lead)}</div>${run(i.run, i.age)}` : '<span class="muted">Unclaimed</span>'}</td><td>${unresolved(i).map(b => link(b)).join(', ') || '<span class="muted">—</span>'}</td><td class="muted">${i.last} ago</td></tr>`).join('') || '<tr><td colspan="7" class="muted">No items match.</td></tr>'}
  </tbody></table></div>`;
  const trow = (i, depth) => { const c = isContainer(i), r = c ? rollup(i.id) : null;
    return `<li><div class="trow ${c ? 'cont' : ''}" aria-level="${depth}"><div class="row" style="min-width:0">${typeBadge(i)}${link(i.id)}<a href="#" data-a="open" data-v="${i.id}" style="color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.title)}</a>${labelsOf(i)}</div>
      ${c ? `<div><div class="bar-mini" role="img" aria-label="${r.done} of ${r.n} done"><i style="width:${r.n ? r.done/r.n*100 : 0}%;background:var(--ok)"></i><i style="width:${r.n ? r.active/r.n*100 : 0}%;background:var(--violet)"></i></div></div><div class="src">${r.done}/${r.n} done${r.blocked ? ` · <span style="color:var(--bad)">${r.blocked} blocked</span>` : ''}</div>`
          : `<div class="row">${statusChip(i)}</div><div>${i.lead ? run(i.run, i.age) : '<span class="src">unclaimed</span>'}</div>`}</div>
      ${childrenOf(i.id).filter(inScope).length ? `<ul class="tree">${childrenOf(i.id).filter(inScope).sort((a,b) => isContainer(b) - isContainer(a)).map(x => trow(x, depth+1)).join('')}</ul>` : ''}</li>`; };
  const roots = items.filter(i => inScope(i) && !i.parent);
  const tree = `<div class="card pad">
      ${roots.filter(i => i.type==='Epic').length ? `<div class="tgroup">Epics</div><ul class="tree">${roots.filter(i => i.type==='Epic').map(i => trow(i,1)).join('')}</ul>` : ''}
      ${roots.filter(i => isContainer(i) && i.type!=='Epic').length ? `<div class="tgroup">Features not in an epic</div><ul class="tree">${roots.filter(i => isContainer(i) && i.type!=='Epic').map(i => trow(i,1)).join('')}</ul>` : ''}
      ${roots.filter(i => !isContainer(i)).length ? `<div class="tgroup">No parent</div><ul class="tree">${roots.filter(i => !isContainer(i)).map(i => trow(i,1)).join('')}</ul>` : ''}
      <div class="src" style="margin-top:10px">Parent = what an item belongs to (one at most). Labels group loosely across the tree. Neither one blocks; only <b>blocks</b> links do.</div></div>`;
  const tset = typesFor(S.scope === 'all' ? 'RCP' : S.scope);
  return `<div class="row" style="justify-content:space-between;margin-bottom:2px"><h1>Work${scopePill()}</h1>
      <div class="seg" role="group" aria-label="Layout"><button data-a="mode" data-v="board" aria-pressed="${S.workMode==='board'}">Board</button><button data-a="mode" data-v="list" aria-pressed="${S.workMode==='list'}">List</button><button data-a="mode" data-v="tree" aria-pressed="${S.workMode==='tree'}">Structure</button></div></div>
    <div class="sub">Inbox → <b>Planning</b> → Ready → In progress → Review → Done. Agents can only claim work from Ready. “Blocked” comes from unresolved <b>blocks</b> links only.</div>
    <div class="filters">
      <label class="sr" for="typesel">Item type</label><select id="typesel" data-a="typef"><option value="all">All types</option>${Object.entries(tset).filter(([,t]) => !t.container).map(([k,t]) => `<option value="${k}" ${S.typeF===k?'selected':''}>${t.icon} ${k}</option>`).join('')}</select>
      <span role="group" aria-label="Saved filters" class="row wrap" style="gap:6px">${Object.entries(FILTERS).map(([k,f]) => `<button class="fchip" data-a="filter" data-v="${k}" aria-pressed="${S.filter===k}">${f[0]} <b>${items.filter(i => inProj(i) && f[1](i)).length}</b></button>`).join('')}</span>
      ${FILTERS[S.filter][2] ? `<span class="src" style="margin-left:auto" title="The same query agents send over MCP">Agent query: <span class="mono">${FILTERS[S.filter][2]}${S.typeF!=='all' ? ' type:'+S.typeF : ''}${S.scope!=='all' ? ' project:'+S.scope : ''}</span></span>` : ''}
    </div>
    ${S.workMode==='board' ? `<div class="board">${cols.map(colHtml).join('')}</div>` : S.workMode==='tree' ? tree : table}`;
};

/* ---------- Ticket ---------- */
function detailFor(i){
  if (DETAIL[i.id]) return DETAIL[i.id];
  return {outcome:'', acceptance:[], planVer:0, steps:[], evidence:[], runs: i.lead ? [{r:i.run, who:i.lead, what:RUNS[i.run] ? RUNS[i.run].d : '', lead:true}] : [],
          activity: i.imported ? [['Nov 1','Imported from Jira (dry-run report reviewed)']] : [['—','Created by owner']]};
}
const defaultTab = i => (i.status === 'review' || i.status === 'done') ? 'evidence' : 'progress';
V.ticket = () => {
  const i = byId[S.ticket], d = detailFor(i), p = P[i.proj];
  const tab = S.tab || defaultTab(i);
  const o = owes(i);
  const activity = [...(S.extraActivity[i.id] || []), ...d.activity];
  const steps = d.steps.map((s, n) => `
    <div class="step"><span class="sicon s-${s.s}" aria-hidden="true">${s.s==='done' ? '✓' : s.s==='blocked' ? '!' : ''}</span>
      <div><div class="title">${n+1}. ${esc(s.t)} ${s.was ? `<s>${esc(s.was)}</s>` : ''}<span class="sr"> (${s.s})</span></div>
        ${s.why ? `<div class="changed">Changed in plan v${d.planVer}: ${esc(s.why)}</div>` : ''}
        ${s.s==='blocked' ? '<div class="changed" style="color:var(--bad)">Stopped here: see the failed run</div>' : ''}
        ${(s.contrib || []).map(c => `<div class="contrib"><div class="row wrap">${prov(c[0])}<b>${esc(c[1])}</b><span class="src">${esc(c[2])}</span></div><div>${esc(c[3])}</div></div>`).join('')}
      </div>
      <div class="src" style="text-align:right">${s.who ? esc(s.who) : 'unassigned'}<br>${s.when || ''}</div></div>`).join('');
  const done = d.steps.filter(s => s.s==='done').length;
  const evid = d.evidence.map(([t,k,src,when]) => `<div class="ev"><span style="font-weight:600">${esc(t)}</span>${prov(k)}<div class="d">${esc(src)} · ${when}</div></div>`).join('');
  const policyChip = p.policy === 'gated'
    ? `<span class="chip c-gray" title="Project approval policy">${small(I.gate)} Owner gates: ${p.gates.join(' → ')}</span>`
    : `<span class="chip c-gray" title="Project approval policy">No owner gate · agent completion closes</span>`;
  const closedNote = i.status==='done' ? (i.closedBy==='owner' ? prov('owner','Closed after owner approval') : prov('agent','Closed by agent completion')) : '';
  const tabs = [['progress', `Progress${d.steps.length ? ` <span class="muted">${done}/${d.steps.length}</span>` : ''}`], ['evidence', `Evidence <span class="muted">${d.evidence.length}</span>`], ['activity','Activity']];
  const planningCard = () => { const req = reqDocs(i), miss = missingDocs(i);
    return `<div class="card pad" style="border-color:var(--teal)"><div class="row wrap" style="justify-content:space-between"><h3 style="margin:0">Definition of ready · ${P[i.proj].short}</h3><span class="src">Project default for ${i.type}: ${req.length ? req.join(', ') : 'no planning docs'} · ${P[i.proj].readyGate === 'agent' ? 'agent may move to Ready' : 'owner moves to Ready'}</span></div>
      ${req.map(d => { const st = (i.planning || {})[d] || 'none'; return `<div class="lrow"><span class="pdoc pd-${st}" style="min-width:58px">${PD[st][0]} ${d}</span><span class="grow">${PD[st][1]}</span>${st==='review' && owes(i)==='review' ? `<button class="btn sm" data-a="review" data-v="${i.id}">Open review</button>` : ''}</div>`; }).join('')}
      <div class="row wrap" style="margin-top:8px"><button class="btn sm ${miss.length ? '' : 'primary'}" data-a="promote" data-v="${i.id}">${I.promote} Move to Ready</button><span class="src grow">${miss.length ? `Missing ${miss.join(', ')}. The tracker records this but doesn't block it: your repo's agent workflow decides whether that's acceptable. Moving anyway is logged.` : P[i.proj].readyGate === 'agent' ? 'Every required doc is approved. This project lets the lead agent move it to Ready; you can also do it now.' : 'Every required doc is approved. This project needs you to move it to Ready.'}</span></div></div>`; };
  return `
  ${!inScope(i) ? `<div class="callout row wrap" style="margin-bottom:12px"><span class="grow">${i.id} belongs to <b>${P[i.proj].short}</b>, outside the project you're viewing.</span><button class="btn sm" data-a="scope" data-v="${i.proj}">Switch to ${P[i.proj].short}</button></div>` : ''}
  <div class="tk-head"><div class="grow">
    <div class="row wrap"><span class="mono muted">${i.id}</span>${typeBadge(i)}${ancestors(i).length ? `<span class="muted">in</span> ${ancestors(i).map(a => `${link(a.id)} <span class="muted">${typeOf(a).icon} ${esc(a.title)}</span>`).join(' <span class="muted">›</span> ')}` : (isContainer(i) ? (i.type === 'Epic' ? '' : '<span class="src">not in an epic</span>') : '<span class="src">no parent</span>')}${labelsOf(i)}${i.imported ? '<span class="chip c-gray">Imported from Jira</span>' : ''}</div>
    <h1 style="margin-top:4px">${esc(i.title)}</h1>
    <div class="row wrap" style="margin-top:6px">${statusChip(i)}${blockedChip(i)}${closedNote}
      <label class="row" style="gap:4px"><span class="src">Priority</span><select data-a="prio" aria-label="Priority">${[1,2,3].map(n => `<option value="${n}" ${i.prio===n?'selected':''}>P${n}</option>`).join('')}</select></label>
      <span class="src">${p.name}</span> ${policyChip}${i.status==='inbox' ? `<button class="btn sm" data-a="toplanning" data-v="${i.id}">Move to Planning</button>` : ''}</div></div>
  </div>
  ${o === 'gate' ? `<div class="banner">${I.gate}<div class="grow"><b>Done is locked.</b> Required owner gate “${esc(i.gate)}” is pending. Agent completion, CI and the merge are recorded below but can't stand in for it.</div><button class="btn primary" data-a="review" data-v="${i.id}">Review now</button></div>` : ''}
  ${o === 'review' ? `<div class="banner">${I.doc}<div class="grow"><b>Review owed:</b> ${esc(i.review)} v${REVIEWS[i.id].versions.slice(-1)[0].v} is waiting for your decision.</div><button class="btn primary" data-a="review" data-v="${i.id}">Open review</button></div>` : ''}
  ${o === 'question' ? `<div class="banner q">${I.question}<div class="grow"><b>${esc(i.question.by)} asked at ${i.question.at}:</b> “${esc(i.question.text)}”
      <label class="f" for="tans">Your answer</label><textarea id="tans" data-t="ans-${i.id}">${esc(S.text['ans-'+i.id] || '')}</textarea>
      <div class="row wrap" style="margin-top:6px"><button class="btn primary sm" data-a="sendanswer" data-v="${i.id}">Send answer</button><span class="src">The run stays paused until ${esc(i.question.by)} reads it.</span></div></div></div>` : ''}
  ${i.question && i.question.answer ? `<div class="callout ok" style="margin-bottom:12px">You answered: “${esc(i.question.answer)}”. Waiting for ${esc(i.question.by)} to read it.</div>` : ''}
  <div class="grid2"><div class="stack">
    ${i.status === 'planning' ? planningCard() : ''}
    ${isContainer(i) ? (() => { const r = rollup(i.id), kids = childrenOf(i.id); return `<div class="card pad"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Contains · ${kids.length} direct, ${r.n} work items in total</h3><span class="src">${r.done}/${r.n} done${r.blocked ? ` · ${r.blocked} blocked` : ''}</span></div>
      <div class="bar-mini" style="margin:8px 0" role="img" aria-label="${r.done} of ${r.n} done"><i style="width:${r.n ? r.done/r.n*100 : 0}%;background:var(--ok)"></i><i style="width:${r.n ? r.active/r.n*100 : 0}%;background:var(--violet)"></i></div>
      ${kids.map(k => `<div class="lrow">${typeBadge(k)}${link(k.id)}${projTag(k.id)}<span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k.title)}</span>${isContainer(k) ? `<span class="src">${rollup(k.id).done}/${rollup(k.id).n} done</span>` : statusChip(k)}</div>`).join('') || '<div class="muted">Empty. Set this as the parent of items to group them here.</div>'}</div>`; })() : ''}
    <div class="card pad"><h3>Outcome</h3><div>${d.outcome ? esc(d.outcome) : '<span class="muted">No outcome written yet.</span>'}</div>
      ${d.acceptance.length ? `<h3 style="margin-top:14px">Acceptance</h3>${d.acceptance.map(([t,e]) => `<div class="lrow"><span class="sicon ${e ? 's-done' : 's-planned'}" aria-hidden="true">${e ? '✓' : ''}</span><span class="grow">${esc(t)}</span>${e ? `<span class="src">${esc(e)}</span>` : '<span class="chip c-info">No evidence</span>'}</div>`).join('')}` : ''}</div>
    <div class="card pad">
      <div class="tabs" role="tablist" aria-label="Item detail">${tabs.map(([k,l]) => `<button role="tab" id="tab-${k}" aria-controls="panel" data-a="tab" data-v="${k}" aria-selected="${tab===k}" tabindex="${tab===k ? 0 : -1}">${l}</button>`).join('')}</div>
      <div role="tabpanel" id="panel" aria-labelledby="tab-${tab}">
      ${tab==='progress' ? (d.steps.length ? `<div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="src">Ticket plan v${d.planVer} · published by the lead · steps are not work items</span>${d.history ? '<button class="btn ghost sm" data-a="planhistory">Plan history</button>' : ''}</div>${steps}` : (isContainer(i) ? '<div class="muted">Containers have no ticket plan. Progress rolls up from the items inside.</div>' : '<div class="muted">No plan yet. The lead agent publishes one when it claims the item.</div>'))
       : tab==='evidence' ? `<div class="src" style="margin-bottom:6px">Each row says who or what produced it. Only ${prov('owner')} counts as human approval.</div>${evid || '<div class="muted">No evidence linked.</div>'}
          ${i.closedBy==='agent' && !S.ackEvidence[i.id] ? `<div class="row wrap" style="margin-top:10px"><button class="btn sm" data-a="ack" data-v="${i.id}">Accept without evidence</button><button class="btn sm" data-a="reopen" data-v="${i.id}">Reopen</button></div>` : ''}`
       : activity.map(a => `<div class="act"><span class="src mono">${a[0]}</span><span>${esc(a[1])}</span></div>`).join('')}
      </div>
    </div>
  </div>
  <div class="stack">
    <div class="card pad"><h3>Lead and runs</h3>
      ${d.runs.map(r => `<div class="lrow" style="align-items:flex-start;padding:6px 0"><div class="grow"><div class="row wrap"><b>${esc(r.who)}</b>${r.lead ? '<span class="chip c-gray">lead</span>' : ''}${run(r.r)}</div><div class="src">${esc(r.what)}</div></div></div>`).join('') || (isContainer(i) ? '<div class="muted">Containers are not claimed. Agents claim the work items inside.</div>' : '<div class="muted">Unclaimed. The next agent that asks for ready work can claim it.</div>')}
      ${d.conflict && i.lead ? `<div class="callout warn" style="margin-top:6px">${esc(d.conflict)}</div>` : ''}
      ${d.error && i.lead ? `<div class="err">${esc(d.error)}</div>` : ''}
      ${i.run==='stale' && i.lead ? `<div class="row wrap" style="margin-top:8px"><button class="btn sm" data-a="release" data-v="${i.id}">Release lead claim…</button></div><div class="src" style="margin-top:4px">Or wait: the lease expires on its own at 11:13.</div>` : ''}
      ${i.run==='failed' && i.lead ? `<div class="row wrap" style="margin-top:8px"><button class="btn sm" data-a="toready" data-v="${i.id}">Return to Ready</button></div><div class="src" style="margin-top:4px">This service never launches agents. A connected agent picks it up next.</div>` : ''}
    </div>
    <div class="card pad"><h3>Dependencies</h3>
      <div class="src">Blocked by</div>${(i.blockedBy || []).map(b => `<div class="lrow">${link(b)}${projTag(b)} ${statusChip(byId[b])}</div>`).join('') || '<div class="lrow muted">Nothing</div>'}
      <div class="src" style="margin-top:6px">Blocks</div>${dependents(i.id).map(x => `<div class="lrow">${link(x.id)}${projTag(x.id)}<span class="src" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.title)}</span></div>`).join('') || '<div class="lrow muted">Nothing</div>'}
      ${(i.relates || []).length ? `<div class="src" style="margin-top:6px">Relates to (doesn't block)</div>${i.relates.map(x => `<div class="lrow">${link(x)}</div>`).join('')}` : ''}
      <button class="btn ghost sm" data-a="gfocus" data-v="${i.id}" style="padding-left:0">Show in graph →</button></div>
    <div class="card pad"><h3>Dates and effort</h3><dl class="kv">
      ${i.start ? `<dt>Planned</dt><dd>${fmt(D(i.start))} → ${fmt(D(i.end))}<div class="src">set by ${esc(i.setBy)}</div></dd>` : '<dt>Planned</dt><dd class="muted">Not set</dd>'}
      ${i.actual ? `<dt>Actual</dt><dd>${fmt(D(i.actual[0]))} → ${i.actual[1] ? fmt(D(i.actual[1])) : 'ongoing'}<div class="src">from run history</div></dd>` : ''}
      <dt>Effort</dt><dd>${i.pts ? `${i.pts} pts<div class="src">set by ${esc((i.lead || 'owner').split(' ')[0])}</div>` : '<span class="muted">Not estimated</span>'}</dd>
    </dl>${dateRisks(i).map(b => `<div class="callout bad" style="margin-top:8px">Starts ${fmt(D(i.start))}, but ${b} is planned to finish ${fmt(D(byId[b].end))}.</div>`).join('')}</div>
  </div></div>`;
};

/* ---------- Reviews ---------- */
const WALK = ['Drag a recipe between days and meal slots','Move a recipe with the keyboard (Space, arrows, Enter)','Reload keeps the plan (RCP-17 is related, not blocking)'];
V.reviews = () => {
  const inS = Object.keys(REVIEWS).filter(k => inScope(byId[k]));
  if (!inS.length) return `<h1>Reviews${scopePill()}</h1><div class="sub">Nothing to review in this project.</div>`;
  if (!inS.includes(S.review)){ S.review = inS.find(k => !S.decided[k]) || inS[0]; S.ver = null; }
  const r = REVIEWS[S.review], vs = r.versions, latest = vs[vs.length-1];
  const cur = vs.find(x => x.v === S.ver) || latest, isLatest = cur === latest;
  const decided = S.decided[S.review];
  const it = byId[S.review];
  const pend = inS.filter(k => !S.decided[k]), done = inS.filter(k => S.decided[k]);
  const qbtn = id => `<button data-a="review" data-v="${id}" aria-current="${S.review===id}"><span class="row"><span class="mono">${id}</span>${S.decided[id] ? decChip(S.decided[id]) : `<span class="chip c-warn">${REVIEWS[id].kind}</span>`}</span><span style="font-weight:600">${esc(REVIEWS[id].title)}</span><span class="src">${esc(byId[id].title)}</span></button>`;
  const content = S.review === 'RCP-23' ? `<div class="doc"><h1>Meal plan templates · UX</h1><p>Planning doc for RCP-23. The PRD (v2) is approved; this covers the screens and flows.</p>
       <h2>Save as template</h2><p>From any week, <code>⋯ → Save as template</code> opens a name field, prefilled with “Week of Nov 9”. Saving shows a toast with Undo.</p>
       <h2>Apply a template</h2><p>The template picker lists templates with a 7-day thumbnail. Applying to a week that already has meals asks: <b>Merge</b> (default) or <b>Replace</b>.</p>
       <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div style="border:1px dashed var(--ctl);border-radius:6px;padding:6px;font-size:11px;color:var(--ink-3);min-height:54px">${d}</div>`).join('')}</div>
       <h2>Open questions</h2><p>Should templates be shared across households? Proposed: no for V1.</p></div>`
    : S.review === 'RCP-19'
    ? `<div class="doc ${S.diff && cur.v>1 ? '' : 'plain'}">${cur.v>1 ? `<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="src">${S.diff ? 'Showing changes since v1' : 'Clean view'}</span><button class="btn sm" data-a="diff" aria-pressed="${S.diff}">${S.diff ? 'Hide changes' : 'Show changes since v1'}</button></div>` : ''}${docHtml(cur.v)}</div>`
    : `<div class="doc"><h1>Release walkthrough · RCP-12</h1><p>Walk through the weekly planner on the merged build and confirm each acceptance criterion yourself.</p>
       <h2>Submitted evidence</h2><div class="row wrap">${prov('agent','codex: acceptance complete')}${prov('ci','CI #91 · 214 passed')}${prov('git','PR #48 merged')}</div>
       <h2>Your walkthrough</h2>${WALK.map((c,n) => `<label class="check"><input type="checkbox" data-a="check" data-v="${n}" ${S.checks[n] ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}
       <div class="src" style="margin-top:6px">${Object.values(S.checks).filter(Boolean).length} of ${WALK.length} checked. Your checklist is saved with the decision.</div></div>`;
  return `<h1>Reviews${scopePill()}</h1><div class="sub">Each decision applies to one exact version. A new revision never inherits an earlier approval.</div>
  <div class="rv">
    <div class="card rvq">${pend.length ? `<div class="sectionhead"><h3>Waiting · ${pend.length}</h3></div>${pend.map(qbtn).join('')}` : ''}${done.length ? `<div class="sectionhead"><h3>Decided today</h3></div>${done.map(qbtn).join('')}` : ''}</div>
    <div class="card" style="min-width:0">
      <div class="vers"><b style="margin-right:4px">${esc(r.title)}</b>
        ${vs.map(x => `<button class="vbtn" data-a="ver" data-v="${x.v}" aria-pressed="${x===cur}">v${x.v} ${x.decision ? decChip(x.decision.k) : x===latest ? decChip(decided) : ''}</button>`).join('')}
        <span class="src" style="margin-left:auto">${cur.by} · ${cur.when} · <span class="mono">${cur.sha}</span></span>
        ${S.review==='RCP-19' ? `<button class="btn sm" data-a="download" data-v="${cur.v}">Download .md</button>` : ''}</div>
      ${!isLatest ? `<div class="callout warn" style="margin:10px 14px 0">You're viewing an older version. Its decision is shown on the right and doesn't carry over to v${latest.v}.</div>` : ''}
      ${content}
    </div>
    <div class="stack">
      ${cur.decision ? `<div class="card pad"><h3>Decision on v${cur.v}</h3>${prov('owner','Changes requested')}<div class="src" style="margin-top:4px">${cur.decision.by} · ${cur.decision.when}</div><div style="margin-top:6px">“${esc(cur.decision.why)}”</div></div>` : ''}
      ${isLatest ? (decided ? `<div class="card pad"><h3>Your decision · v${cur.v}</h3>${prov('owner', DEC[decided][3])}
          ${S.text['rat-'+S.review] ? `<div style="margin-top:6px">“${esc(S.text['rat-'+S.review])}”</div>` : ''}
          <div class="src" style="margin-top:6px">Recorded just now. Applies to <span class="mono">${cur.sha}</span>. Agents see it on their next query.</div>
          <button class="btn sm" style="margin-top:8px" data-a="undodec">Undo</button></div>`
        : `<div class="card pad"><h3>Decide on v${cur.v}</h3>
          <div class="dec" role="radiogroup" aria-label="Decision">${Object.entries(DEC).map(([k,[l,ic]]) => `<button role="radio" aria-checked="${S.decision===k}" data-a="dec" data-v="${k}" style="${k==='approve'?'color:var(--ok)':k==='changes'?'color:var(--warn)':''}">${I[ic]}${l}</button>`).join('')}</div>
          <label class="f" for="rat">Reason ${S.decision && S.decision!=='approve' ? '<b style="color:var(--bad)">(required)</b>' : '(optional for Approve)'}</label>
          <textarea id="rat" data-t="rat-${S.review}" placeholder="What should the agent know?">${esc(S.text['rat-'+S.review] || '')}</textarea>
          <button class="btn primary" style="margin-top:8px;width:100%;justify-content:center" data-a="submitdec" ${S.decision ? '' : 'disabled'}>${S.decision ? `Record: ${DEC[S.decision][0]}` : 'Choose a decision'}</button>
          <div class="callout" style="margin-top:10px">Applies to v${cur.v} · <span class="mono">${cur.sha}</span>. ${S.review==='RCP-12' ? 'Approving moves RCP-12 to Done and makes RCP-22 startable.' : S.review==='RCP-23' ? 'Approving marks UX approved. RCP-23 still needs its TDD before it can move to Ready.' : 'If claude submits v3, it needs a new decision.'}</div></div>`) : ''}
      <div class="card pad"><h3>Item</h3><div class="row wrap">${link(it.id)}${statusChip(it)}</div><div style="margin-top:4px">${esc(it.title)}</div></div>
    </div>
  </div>`;
};

/* ---------- Dependencies ---------- */
const GN = {'DOC-4':[30,70],'RCP-16':[260,70],'RCP-15':[30,180],'RCP-14':[30,260],'RCP-21':[260,220],'RCP-12':[30,350],'RCP-22':[260,350],'RCP-17':[260,430],'DOC-7':[530,110],'DOC-8':[530,260]};
const NW = 180, NH = 48;
V.graph = () => {
  const vis = Object.keys(GN).filter(id => inScope(byId[id]));
  const ext = Object.keys(GN).filter(id => !inScope(byId[id]) && items.some(x => inScope(x) && GN[x.id] && ((x.blockedBy || []).includes(id) || (byId[id].blockedBy || []).includes(x.id))));
  const shown = new Set([...vis, ...ext]);
  if (!vis.includes(S.graphSel)) S.graphSel = vis.includes('RCP-21') ? 'RCP-21' : vis[0];
  const sel = S.graphSel, cyc = cycleSet(), si = byId[sel];
  const edges = []; items.forEach(i => (i.blockedBy || []).forEach(b => { if (shown.has(b) && shown.has(i.id)) edges.push([b, i.id]); }));
  const chain = new Set(); (function walk(id){ unresolved(byId[id]).forEach(b => { if (!chain.has(b)){ chain.add(b); walk(b); } }); })(sel);
  const frees = freedBy(sel), still = holdsUp(sel).filter(x => !frees.includes(x));
  const path = (a, b) => {
    const [x1,y1] = GN[a], [x2,y2] = GN[b];
    if (x1 === x2){ const dx = a < b ? -40 : 40, down = y2 > y1; return `M${x1+NW/2+dx},${y1+(down?NH:0)} C${x1+NW/2+dx*2.4},${(y1+y2)/2+NH/2} ${x2+NW/2+dx*2.4},${(y1+y2)/2+NH/2} ${x2+NW/2+dx},${y2+(down?0:NH)}`; }
    return `M${x1+NW},${y1+NH/2} C${x1+NW+40},${y1+NH/2} ${x2-40},${y2+NH/2} ${x2},${y2+NH/2}`;
  };
  const node = id => {
    const [x,y] = GN[id], i = byId[id];
    const cls = [id===sel?'sel':'', chain.has(id)?'chain':'', frees.includes(id)?'unblock':'', i.status==='done'?'done':'', cyc.has(id)?'cyc':'', !inScope(i) ? 'ext' : ''].join(' ');
    const rs = i.run ? RUNS[i.run].l : '';
    return `<g class="gnode ${cls}" data-a="gsel" data-v="${id}" tabindex="0" role="button" aria-pressed="${id===sel}" aria-label="${id}, ${esc(i.title)}, ${STATUS[i.status]}${isBlocked(i)?', blocked':''}${rs?', run '+rs:''}">
      <rect class="b" x="${x}" y="${y}" width="${NW}" height="${NH}" rx="8"/>
      <text x="${x+10}" y="${y+18}" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">${id} · ${!inScope(i) ? P[i.proj].short + ' ↗' : STATUS[i.status] + (rs ? ' · '+rs : '')}</text>
      <text x="${x+10}" y="${y+35}" font-size="12.5" font-weight="600" fill="var(--ink)">${esc(i.title.length>25 ? i.title.slice(0,24)+'…' : i.title)}</text></g>`;
  };
  let impact;
  if (si.end){
    const newEnd = new Date(D(si.end).getTime() + S.slip*864e5);
    const deps = dependents(sel).filter(isOpen);
    impact = `<div class="row wrap" style="margin:6px 0"><span class="src">If ${sel} slips</span><span class="seg" role="group" aria-label="Slip days">${[1,3,5].map(n => `<button data-a="slip" data-v="${n}" aria-pressed="${S.slip===n}">${n}d</button>`).join('')}</span></div>
      <div class="src">New planned end: <b style="color:var(--ink)">${fmt(newEnd)}</b></div>
      ${deps.map(x => x.start ? (D(x.start) <= newEnd ? `<div class="lrow">${link(x.id)}<span class="chip c-bad">conflict</span><span class="src">starts ${fmt(D(x.start))}</span></div>` : `<div class="lrow">${link(x.id)}<span class="chip c-ok">ok</span><span class="src">starts ${fmt(D(x.start))}</span></div>`) : `<div class="lrow">${link(x.id)}<span class="chip c-gray">unknown</span><span class="src">no dates</span></div>`).join('') || '<div class="src">Nothing downstream.</div>'}`;
  } else impact = `<div class="src">${sel} has no planned end, so the impact is unknown.</div>`;
  return `<div class="row" style="justify-content:space-between"><h1>Dependencies${scopePill()}</h1>
      <div class="row"><button class="fchip" data-a="grel" aria-pressed="${S.gRel}">Show “relates”</button></div></div>
    <div class="sub">Arrows mean “blocks”. Select an item to see what it waits on (red) and what finishing it would free (green). Items from other projects that block or depend on this one appear dashed.</div>
    <div class="grid2"><div class="card" style="overflow:auto">
      <svg viewBox="0 0 760 500" width="100%" style="min-width:620px;display:block" role="group" aria-label="Dependency graph">
        <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--ink-3)"/></marker>
        <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--bad)"/></marker></defs>
        ${[...cyc].some(id => shown.has(id)) ? `<rect x="510" y="40" width="220" height="300" rx="12" fill="var(--bad-soft)" opacity=".55"/><text x="522" y="62" font-size="12" fill="var(--bad)" font-weight="700">Cycle in imported data</text>`
                   : `<text x="522" y="62" font-size="12" fill="var(--ok)" font-weight="700">✓ No cycles</text>`}
        ${edges.map(([a,b]) => { const hot = chain.has(a) && (chain.has(b) || b===sel), c = cyc.has(a) && cyc.has(b); return `<path class="edge ${hot?'hot':''} ${c?'cyc':''}" d="${path(a,b)}" marker-end="url(#${hot||c?'ahr':'ah'})"/>`; }).join('')}
        ${S.gRel && shown.has('RCP-12') && shown.has('RCP-17') ? `<path class="edge rel" d="M${GN['RCP-12'][0]+90},${GN['RCP-12'][1]+NH} C${GN['RCP-12'][0]+90},${GN['RCP-17'][1]+NH/2} ${GN['RCP-17'][0]-60},${GN['RCP-17'][1]+NH/2} ${GN['RCP-17'][0]},${GN['RCP-17'][1]+NH/2}"/><text x="${GN['RCP-12'][0]+20}" y="${GN['RCP-17'][1]+NH/2+20}" font-size="11.5" fill="var(--ink-3)">relates · doesn't block</text>` : ''}
        ${Object.keys(GN).filter(id => shown.has(id) && (S.gRel || id !== 'RCP-17')).map(node).join('')}
      </svg>
      <div class="legend pad" style="border-top:1px solid var(--line)">
        <span><svg width="26" height="8" aria-hidden="true"><path d="M0,4H26" stroke="var(--bad)" stroke-width="2.6"/></svg>Waits on (blocking chain)</span>
        <span><svg width="18" height="12" aria-hidden="true"><rect x="1" y="1" width="16" height="10" rx="3" fill="none" stroke="var(--ok)" stroke-dasharray="4 2" stroke-width="2"/></svg>Freed when selected is done</span>
        <span><svg width="26" height="8" aria-hidden="true"><path d="M0,4H26" stroke="var(--bad)" stroke-dasharray="6 3"/></svg>Cycle</span>
        <span><svg width="26" height="8" aria-hidden="true"><path d="M0,4H26" stroke="var(--ctl)" stroke-dasharray="3 4"/></svg>Relates</span>
        <span><svg width="18" height="12" aria-hidden="true"><rect x="1" y="1" width="16" height="10" rx="3" fill="var(--panel-2)" stroke="var(--ctl)" stroke-dasharray="3 2"/></svg>Other project</span></div>
    </div>
    <div class="stack">
      <div class="card pad"><h3>Selected</h3><div class="row wrap">${link(sel)} ${statusChip(si)} ${run(si.run, si.age)}</div><div style="font-weight:650;margin:4px 0 10px">${esc(si.title)}</div>
        ${cyc.has(sel) ? `<div class="callout bad" style="margin-bottom:10px">In a cycle: ${[...cyc].sort().join(' → ')} → ${[...cyc].sort()[0]}. Neither can become ready. Remove one link to fix it.
          <div class="row wrap" style="margin-top:6px">${(si.blockedBy||[]).filter(b => cyc.has(b)).map(b => `<button class="btn sm" data-a="rmlink" data-v="${b}>${sel}">Remove “${b} blocks ${sel}”</button>`).join('')}</div></div>` : ''}
        <div class="src">Waits on (including indirect)</div>${[...chain].map(b => `<div class="lrow">${link(b)}${projTag(b)}${statusChip(byId[b])}${run(byId[b].run, byId[b].age)}</div>`).join('') || '<div class="lrow muted">Nothing. It can start now.</div>'}
        <div class="src" style="margin-top:8px">Done would free</div>${frees.map(b => `<div class="lrow">${link(b)}<span style="font-size:12.5px">${esc(byId[b].title)}</span></div>`).join('') || '<div class="lrow muted">Nothing on its own</div>'}
        ${still.length ? `<div class="src" style="margin-top:8px">Also needed by (still blocked by others)</div>${still.map(b => `<div class="lrow">${link(b)}<span class="src">also waits on ${unresolved(byId[b]).filter(x => x!==sel).join(', ')}</span></div>`).join('')}` : ''}
        <button class="btn sm" data-a="open" data-v="${sel}" style="margin-top:10px">Open item</button></div>
      <div class="card pad"><h3>Delay impact</h3>${impact}<div class="src" style="margin-top:6px">Uses entered dates only. Items without dates show as unknown.</div></div>
    </div></div>`;
};

/* ---------- Timeline ---------- */
V.timeline = () => {
  const start = D('2026-11-02'), days = 35;
  const pct = d => ((d - start) / 864e5 / days * 100);
  const rows = items.filter(i => i.start && !isContainer(i) && inScope(i)).sort((a,b) => D(a.start) - D(b.start));
  const undated = items.filter(i => !i.start && !isContainer(i) && isOpen(i) && inScope(i));
  const fcProj = S.scope === 'all' ? 'RCP' : S.scope, have = fcProj === 'RCP' ? 2 : 0;
  const endX = s => pct(new Date(D(s).getTime() + 864e5)); // bars include their end day
  const nowX = pct(NOW);
  const row = i => {
    const risks = dateRisks(i), done = i.status === 'done';
    const s = pct(D(i.start)), e = endX(i.end);
    const deps = unresolved(i).filter(b => byId[b].end).map(b => { const x = endX(byId[b].end), r = risks.includes(b);
      return `<div class="dep ${r?'risk':''}" style="left:${x}%" title="${b} planned to finish ${fmt(D(byId[b].end))}"></div>`; }).join('');
    const after = unresolved(i).filter(b => byId[b].end).map(b => `${risks.includes(b) ? '<b style="color:var(--bad)">' : ''}${b} ends ${fmt(D(byId[b].end))}${risks.includes(b) ? '</b>' : ''}`);
    const overdue = !done && D(i.end) < D(NOW.toISOString().slice(0,10));
    return `<div class="tl-row"><div class="lbl">${link(i.id)}<span class="t" title="${esc(i.title)}">${esc(i.title)}</span></div>
      <div class="track">
        <div class="today" style="left:${nowX}%"></div>${deps}
        <div class="bar planned ${risks.length ? 'risk' : ''} ${done ? 'done' : ''}" style="left:${s}%;width:${e-s}%">${risks.length ? '⚠ blocker ends later' : overdue ? 'overdue' : done ? '✓ done' : isBlocked(i) ? '⊘ blocked' : ''}</div>
        ${i.actual ? `<div class="bar actual" style="left:${pct(D(i.actual[0]))}%;width:${(i.actual[1] ? Math.min(endX(i.actual[1]), nowX) : nowX) - pct(D(i.actual[0]))}%" title="Actual run time"></div>` : ''}
        <div class="setby" style="left:calc(${s}% + 1px)">set by ${esc(i.setBy)}${after.length ? ` · after ${after.join(', ')}` : ''}</div>
      </div></div>`;
  };
  const fcStart = pct(D('2026-11-24')), fcEnd = endX('2026-12-03');
  const fc = S.fcPreview && fcProj === 'RCP'
    ? `<div class="bar forecast" style="left:${fcStart}%;width:${fcEnd-fcStart}%">P50 Nov 24 – P85 Dec 3</div><div class="setby" style="left:calc(${fcStart}% + 1px)">preview · 6.2 pts/wk over the last 4 weeks · n=11 · 80% range</div><button class="btn ghost sm" data-a="fc" style="position:absolute;left:8px;top:10px">Hide preview</button>`
    : `<div style="position:absolute;left:10px;top:12px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)">No forecast yet: needs 8 completed items with effort (have ${have}). ${fcProj === 'RCP' ? '<button class="btn ghost sm" data-a="fc">Preview what it will look like</button>' : ''}</div>`;
  return `<div class="row" style="justify-content:space-between"><h1>Timeline${scopePill()}</h1><span class="src">Nov 2 – Dec 6 · by week</span></div>
    <div class="sub">Bars are <b>entered</b> dates, each labeled with who set them. The thin purple bar is actual run time. Dashed markers show when a blocker is planned to finish. Forecasts get their own lane and never overwrite entered dates.</div>
    <div class="card" style="overflow:auto"><div style="min-width:860px">
      <div class="weeks"><div></div><div style="display:grid;grid-template-columns:repeat(5,1fr)">${['Nov 2','Nov 9','Nov 16','Nov 23','Nov 30'].map(w => `<div class="w"><span>${w}</span></div>`).join('')}</div></div>
      ${rows.map(row).join('')}
      <div class="tl-row" style="background:var(--panel-2)"><div class="lbl"><b>Forecast · ${P[fcProj].short} backlog</b></div><div class="track">${fc}</div></div>
    </div></div>
    <div class="row wrap" style="margin-top:10px;justify-content:space-between">
      <div class="legend"><span><span class="bar planned" style="position:static;width:26px;height:12px"></span>Entered plan</span><span><span class="bar actual" style="position:static;width:26px"></span>Actual</span><span><span class="bar forecast" style="position:static;width:26px;height:12px"></span>Forecast (computed)</span><span><span style="display:inline-block;width:0;height:14px;border-left:2px dashed var(--ink-3)"></span>Blocker's planned end</span><span><span style="display:inline-block;width:0;height:14px;border-left:2px solid var(--bad)"></span>Now</span></div>
      <div class="src">Not on the timeline (no dates): ${undated.map(i => link(i.id)).join(', ') || 'none'}</div></div>`;
};
