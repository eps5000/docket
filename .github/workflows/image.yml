# Builds Docket's container image on GitHub's runners and publishes it to
# ghcr.io/eps5000/docket, so a machine running Docket only downloads it
# (docker compose pull) instead of building locally. The owner's machine is
# shared with heavy local work; see docker/README or the main README,
# "Updating from the published image".
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One group per commit: every main commit is published, and a newer merge never cancels an older
# build (owner decision 51). This workflow doesn't depend on the ci workflow's tests.
concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Docket
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Builds can finish out of order now that none is cancelled, so `main` moves only to the
      # commit that is still the newest.
      - name: Move the main tag to the newest commit
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create -t "ghcr.io/${GITHUB_REPOSITORY,,}:main" "$IMAGE"
            echo "main now points at $GITHUB_SHA."
          else
            echo "main is at $tip, so $GITHUB_SHA keeps only its sha tag."
          fi
