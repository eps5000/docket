name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names `build` and `e2e` are the check names the Mergify queue requires.
# Rename them only together with the Mergify configuration.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm -r lint
          pnpm format:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Vitest
        run: pnpm -r test

      # FR-106 (T145): the contract and integration suites again, in a container with no
      # network at all, with every outbound attempt recorded by the egress audit. Any
      # attempt fails the step. (The audit's own probe test runs in the step above.)
      - name: Contract suite with no network (FR-106)
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp             -v "$PWD:/w" -w /w/server             -e NODE_OPTIONS=--import=/w/docker/no-egress/egress-audit.mjs             -e DOCKET_EGRESS_LOG=/w/egress-contract.jsonl             node:22-bookworm-slim             node node_modules/vitest/vitest.mjs run tests/contract tests/integration               --exclude tests/integration/no-egress.test.ts
          if [ -s egress-contract.jsonl ]; then
            echo "Outbound connection attempts during the contract suite:"
            cat egress-contract.jsonl
            exit 1
          fi
          echo "No outbound connection attempts."

      - name: Docker build
        run: docker build -f docker/Dockerfile -t docket:ci .

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @docket/web exec playwright install --with-deps chromium

      # US9 (T141): a synthetic Jira site on the compose network for the import dialog's
      # e2e (docker/compose.jira-fixture.yaml), with a throwaway test CA. No internet.
      - name: Jira fixture certificates
        run: docker/jira-fixture/make-certs.sh

      # FR-106 (T145): the container runs on an internal network with no route out
      # (docker/compose.no-egress.yaml). Only the Jira fixture is reachable from it; the
      # browser comes in through a loopback-published gateway.
      - name: Build and start the container (sealed, no egress)
        env:
          DOCKET_SEED: sample
          DOCKET_SEED_STRESS: '1'
        run: docker compose -f docker/compose.yaml -f docker/compose.jira-fixture.yaml -f docker/compose.push-e2e.yaml -f docker/compose.no-egress.yaml up -d --build --wait --wait-timeout 120

      - name: Playwright
        env:
          DOCKET_E2E_NO_START: '1'
          # The runner's fresh docket-data volume is disposable (fixtures/container.ts).
          DOCKET_E2E_ALLOW_RESET: '1'
        run: pnpm --filter @docket/web e2e

      # Decision 32 (T167): the specs tagged @protected, against the same container restarted
      # with DOCKET_PROTECTED_MODE=on (owner unlock and agent token), then back to local trust.
      - name: Playwright, protected mode (decision 32)
        env:
          DOCKET_SEED: sample
          DOCKET_SEED_STRESS: '1'
          DOCKET_PROTECTED_MODE: 'on'
          DOCKET_E2E_NO_START: '1'
          DOCKET_E2E_ALLOW_RESET: '1'
          DOCKET_E2E_PROTECTED: '1'
        run: |
          docker compose -f docker/compose.yaml -f docker/compose.jira-fixture.yaml -f docker/compose.push-e2e.yaml -f docker/compose.no-egress.yaml up -d --wait --wait-timeout 120
          pnpm --filter @docket/web e2e

      - name: Back to local trust
        env:
          DOCKET_SEED: sample
          DOCKET_SEED_STRESS: '1'
        run: docker compose -f docker/compose.yaml -f docker/compose.jira-fixture.yaml -f docker/compose.push-e2e.yaml -f docker/compose.no-egress.yaml up -d --wait --wait-timeout 120

      # FR-106 (T145): nothing in the container tried to reach another host during the
      # whole e2e run, and a deliberate probe is caught (so the check can fail).
      - name: No egress (FR-106)
        run: docker/no-egress/check.sh -f docker/compose.yaml -f docker/compose.jira-fixture.yaml -f docker/compose.push-e2e.yaml -f docker/compose.no-egress.yaml

      # SC-008 (T128): `docker compose down && up` keeps every item, event and document,
      # and a backup restores identically into a scratch volume.
      - name: Container replacement keeps the data (SC-008)
        run: docker/check-replacement.sh -f docker/compose.yaml -f docker/compose.jira-fixture.yaml -f docker/compose.push-e2e.yaml -f docker/compose.no-egress.yaml

      - name: Container logs
        if: failure()
        run: docker compose -f docker/compose.yaml -f docker/compose.jira-fixture.yaml -f docker/compose.push-e2e.yaml -f docker/compose.no-egress.yaml logs --no-color

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

      - name: Stop the container
        if: always()
        run: docker compose -f docker/compose.yaml -f docker/compose.jira-fixture.yaml -f docker/compose.push-e2e.yaml -f docker/compose.no-egress.yaml down --volumes
